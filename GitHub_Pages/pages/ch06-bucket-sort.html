<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch06-bucket-sort</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:720/440;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:6}.cell text{font-size:14px;font-weight:700;text-anchor:middle}.cell.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.cell.bucketActive rect{fill:#ffedd5;stroke:var(--swap);stroke-width:4}.cell.filled rect{fill:#dcfce7;stroke:var(--done);stroke-width:3}.marker{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--active)}.formula{font-size:16px;font-weight:700;fill:var(--ink)}.rowlabel{font-size:13px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch06-bucket-sort</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="28100" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 720 440" role="img" aria-label="バケットソートのアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 28100,
  "code": ["void bucket_sort(real A[], int n, real l, real u) {","    for (int i = 0; i <= n - 1; i++) {","        int j = floor(n * (A[i] - l) / (u - l));","        insert A[i] at the head of bucket[j];","    }","","    for (int j = 0; j <= n - 1; j++) {","        insertion_sort(bucket[j]);","    }","","    concatenate bucket[0], bucket[1], ..., bucket[n - 1] into A;","}"],
  "input": [15,16,2,12,3,4,11,18,1,23],
  "frames": [
    {"at":0,"i":0,"j":6,"buckets":[[],[],[],[],[],[],[15],[],[],[]],"highlight":6,"result":[],"codeLines":[1,2,3],"label":"i = 0: A[0] = 15","note":"n=10, l=0, u=25 なので j = floor(10*(15-0)/25) = 6. bucket[6] の先頭へ挿入する."},
    {"at":1300,"i":1,"j":6,"buckets":[[],[],[],[],[],[],[16,15],[],[],[]],"highlight":6,"result":[],"codeLines":[1,2,3],"label":"i = 1: A[1] = 16","note":"j = 6. すでにある 15 の前に 16 を挿入するので bucket[6] = [16, 15] になる."},
    {"at":2600,"i":2,"j":0,"buckets":[[2],[],[],[],[],[],[16,15],[],[],[]],"highlight":0,"result":[],"codeLines":[1,2,3],"label":"i = 2: A[2] = 2","note":"j = floor(10*2/25) = 0. bucket[0] へ挿入する."},
    {"at":3900,"i":3,"j":4,"buckets":[[2],[],[],[],[12],[],[16,15],[],[],[]],"highlight":4,"result":[],"codeLines":[1,2,3],"label":"i = 3: A[3] = 12","note":"j = floor(10*12/25) = 4. bucket[4] へ挿入する."},
    {"at":5200,"i":4,"j":1,"buckets":[[2],[3],[],[],[12],[],[16,15],[],[],[]],"highlight":1,"result":[],"codeLines":[1,2,3],"label":"i = 4: A[4] = 3","note":"j = floor(10*3/25) = 1. bucket[1] へ挿入する."},
    {"at":6500,"i":5,"j":1,"buckets":[[2],[4,3],[],[],[12],[],[16,15],[],[],[]],"highlight":1,"result":[],"codeLines":[1,2,3],"label":"i = 5: A[5] = 4","note":"j = 1. 先頭挿入なので bucket[1] = [4, 3] になる."},
    {"at":7800,"i":6,"j":4,"buckets":[[2],[4,3],[],[],[11,12],[],[16,15],[],[],[]],"highlight":4,"result":[],"codeLines":[1,2,3],"label":"i = 6: A[6] = 11","note":"j = 4. bucket[4] = [11, 12] になる."},
    {"at":9100,"i":7,"j":7,"buckets":[[2],[4,3],[],[],[11,12],[],[16,15],[18],[],[]],"highlight":7,"result":[],"codeLines":[1,2,3],"label":"i = 7: A[7] = 18","note":"j = floor(10*18/25) = 7. bucket[7] へ挿入する."},
    {"at":10400,"i":8,"j":0,"buckets":[[1,2],[4,3],[],[],[11,12],[],[16,15],[18],[],[]],"highlight":0,"result":[],"codeLines":[1,2,3],"label":"i = 8: A[8] = 1","note":"j = 0. bucket[0] = [1, 2] になる."},
    {"at":11700,"i":9,"j":9,"buckets":[[1,2],[4,3],[],[],[11,12],[],[16,15],[18],[],[23]],"highlight":9,"result":[],"codeLines":[1,2,3],"label":"i = 9: A[9] = 23","note":"j = floor(10*23/25) = 9. これで全要素の振り分けが終わった."},
    {"at":13500,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[16,15],[18],[],[23]],"highlight":1,"result":[],"codeLines":[6,7],"label":"bucket[1] を insertion_sort する","note":"[4, 3] は昇順でないため, 内部で挿入ソートして [3, 4] に直す."},
    {"at":15300,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":6,"result":[],"codeLines":[6,7],"label":"bucket[6] を insertion_sort する","note":"[16, 15] を挿入ソートして [15, 16] に直す. 他のバケットはすでに昇順である."},
    {"at":17300,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":0,"result":[1,2],"codeLines":[10],"label":"bucket[0] を連結する","note":"1, 2 を結果配列の先頭へ書き出す."},
    {"at":19100,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":1,"result":[1,2,3,4],"codeLines":[10],"label":"bucket[1] を連結する","note":"3, 4 を続けて書き出す. bucket[2], bucket[3] は空なので何も書き出さない."},
    {"at":20900,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":4,"result":[1,2,3,4,11,12],"codeLines":[10],"label":"bucket[4] を連結する","note":"11, 12 を書き出す."},
    {"at":22700,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":6,"result":[1,2,3,4,11,12,15,16],"codeLines":[10],"label":"bucket[6] を連結する","note":"15, 16 を書き出す. bucket[5] は空である."},
    {"at":24500,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":7,"result":[1,2,3,4,11,12,15,16,18],"codeLines":[10],"label":"bucket[7] を連結する","note":"18 を書き出す."},
    {"at":26300,"i":-1,"j":-1,"buckets":[[1,2],[3,4],[],[],[11,12],[],[15,16],[18],[],[23]],"highlight":9,"result":[1,2,3,4,11,12,15,16,18,23],"codeLines":[10],"label":"bucket[9] を連結する: 完了","note":"23 を書き出すと A は 1,2,3,4,11,12,15,16,18,23 に整列される."}
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function render(ms){
      const f=script.frames[frameIndexAt(ms)],x0=18,w=56,gap=6,colw=w+gap;
      svg.innerHTML="";
      write(20,20,"A (入力, l=0, u=25, n=10)","rowlabel");
      script.input.forEach((v,idx)=>{
        const x=x0+idx*colw,g=el("g"),r=el("rect"),t=el("text");
        g.setAttribute("class",`cell ${f.i===idx?"active":""}`);
        g.setAttribute("transform",`translate(${x} 30)`);
        r.setAttribute("width",w);r.setAttribute("height",34);
        t.setAttribute("x",w/2);t.setAttribute("y",22);t.textContent=v;
        g.append(r,t);svg.append(g);
        write(x+w/2,82,String(idx),"marker");
      });
      if(f.i>=0)write(x0+f.i*colw+w/2,-6+16,`j=${f.j}`,"marker");
      write(20,108,"buckets[0..9]","rowlabel");
      const baseY=250;
      for(let j=0;j<10;j++){
        const x=x0+j*colw,items=f.buckets[j],active=f.highlight===j;
        const hg=el("g"),hr=el("rect"),ht=el("text");
        hg.setAttribute("class",`cell ${active?"bucketActive":""}`);
        hg.setAttribute("transform",`translate(${x} ${baseY})`);
        hr.setAttribute("width",w);hr.setAttribute("height",28);
        ht.setAttribute("x",w/2);ht.setAttribute("y",19);ht.textContent=`B[${j}]`;
        hg.append(hr,ht);svg.append(hg);
        items.forEach((v,k)=>{
          const y=baseY-(k+1)*32,ig=el("g"),ir=el("rect"),it=el("text");
          ig.setAttribute("class",`cell ${active?"bucketActive":""}`);
          ig.setAttribute("transform",`translate(${x} ${y})`);
          ir.setAttribute("width",w);ir.setAttribute("height",28);
          it.setAttribute("x",w/2);it.setAttribute("y",19);it.textContent=v;
          ig.append(ir,it);svg.append(ig);
        });
      }
      write(20,300,"A (結果, 連結後)","rowlabel");
      for(let idx=0;idx<10;idx++){
        const x=x0+idx*colw,filled=idx<f.result.length,g=el("g"),r=el("rect"),t=el("text");
        g.setAttribute("class",`cell ${filled?"filled":""}`);
        g.setAttribute("transform",`translate(${x} 312)`);
        r.setAttribute("width",w);r.setAttribute("height",34);
        t.setAttribute("x",w/2);t.setAttribute("y",22);t.textContent=filled?f.result[idx]:"";
        g.append(r,t);svg.append(g);
        write(x+w/2,364,String(idx),"marker");
      }
      label.textContent=f.label;note.textContent=f.note;
      [...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));
      seek.value=ms;
    }
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
</html>
