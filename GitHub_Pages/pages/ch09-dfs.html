const COLOR_FILL = {white: "#ffffff", gray: "#dbeafe", black: "#dcfce7"};
const COLOR_STROKE = {white: "#94a3b8", gray: "#2563eb", black: "#16a34a"};

function sameEdge(e, a, b) {
  if (!e) return false;
  return e[0] === a && e[1] === b;
}

function drawGraph(f) {
  arrowDefs();
  EDGES.forEach(([a, b]) => {
    const pa = POS[a], pb = POS[b];
    const dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    const line = el("line");
    line.setAttribute("x1", pa.x + ux * R);
    line.setAttribute("y1", pa.y + uy * R);
    line.setAttribute("x2", pb.x - ux * R);
    line.setAttribute("y2", pb.y - uy * R);
    const active = sameEdge(f.activeEdge, a, b);
    line.setAttribute("stroke", active ? "#2563eb" : "#94a3b8");
    line.setAttribute("stroke-width", active ? "5" : "3");
    line.setAttribute("marker-end", active ? "url(#arrow-active)" : "url(#arrow)");
    svg.append(line);
  });
  Object.keys(POS).forEach((vid) => {
    const p = POS[vid];
    const c = f.colors[vid];
    const circle = el("circle");
    circle.setAttribute("cx", p.x);
    circle.setAttribute("cy", p.y);
    circle.setAttribute("r", R);
    circle.setAttribute("fill", COLOR_FILL[c]);
    circle.setAttribute("stroke", COLOR_STROKE[c]);
    circle.setAttribute("stroke-width", vid === f.activeVertex ? "5" : "3");
    svg.append(circle);
    const t = el("text");
    t.setAttribute("x", p.x);
    t.setAttribute("y", p.y + 5);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "15");
    t.setAttribute("font-weight", "700");
    t.textContent = vid;
    svg.append(t);
    const dv = f.d[vid] !== undefined ? f.d[vid] : "-";
    const fv = f.fin[vid] !== undefined ? f.fin[vid] : "-";
    write(p.x + R + 14, p.y - 4, "d=" + dv, "marker");
    write(p.x + R + 14, p.y + 12, "f=" + fv, "marker");
  });
}

function drawStack(f) {
  write(560, 40, "スタック (再帰呼び出し, 下=s)", "rowlabel");
  const x0 = 560, yBase = 380, w = 140, h = 32;
  f.stack.forEach((vid, i) => {
    const y = yBase - i * (h + 4);
    const g = el("g");
    g.setAttribute("class", "cell active");
    const r = el("rect");
    r.setAttribute("x", x0);
    r.setAttribute("y", y);
    r.setAttribute("width", w);
    r.setAttribute("height", h);
    g.append(r);
    const t = el("text");
    t.setAttribute("x", x0 + w / 2);
    t.setAttribute("y", y + h / 2 + 5);
    t.textContent = "traverse(" + vid + ")";
    g.append(t);
    svg.append(g);
  });
}

function drawLegend() {
  const items = [
    {c: "white", label: "未発見"},
    {c: "gray", label: "発見済み・スタック上"},
    {c: "black", label: "探索完了"}
  ];
  items.forEach((it, i) => {
    const y = 440 + i * 34;
    const circle = el("circle");
    circle.setAttribute("cx", 572);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", 12);
    circle.setAttribute("fill", COLOR_FILL[it.c]);
    circle.setAttribute("stroke", COLOR_STROKE[it.c]);
    circle.setAttribute("stroke-width", "3");
    svg.append(circle);
    write(597, y + 5, it.label, "rowlabel");
  });
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  drawGraph(f);
  drawStack(f);
  drawLegend();
  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
</html>
