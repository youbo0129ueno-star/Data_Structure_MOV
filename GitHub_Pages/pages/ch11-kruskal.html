const POS = {

  d: {x: 410, y: 120},
  e: {x: 410, y: 340},

const EDGES = [
  ["a", "b", 1],
  ["c", "e", 2],
  ["a", "c", 3],
  ["b", "c", 4],
  ["b", "d", 6],
  ["d", "e", 7],
  ["e", "f", 14],
  ["d", "f", 15]
];
const VERTS = ["a", "b", "c", "d", "e", "f"];
const R = 22;
const GROUP_COLORS = ["#2563eb", "#16a34a", "#f97316", "#a855f7", "#0ea5e9", "#dc2626"];

function edgeKey(a, b) {
  return [a, b].sort().join("-");
}

function isSameEdge(list, a, b) {
  return (list || []).some((e) => edgeKey(e[0], e[1]) === edgeKey(a, b));
}

function groupColorMap(groups) {
  const roots = [];
  VERTS.forEach((v) => {
    const r = groups[v];
    if (!roots.includes(r)) roots.push(r);
  });
  const map = {};
  roots.forEach((r, i) => {
    map[r] = GROUP_COLORS[i % GROUP_COLORS.length];
  });
  return map;
}

  arrowDefs();
  const colorOf = groupColorMap(f.groups);
  const acceptedEdges = f.T.map(([u, v]) => [u, v]);
  const rejectedEdges = (f.rejected || []).map(([u, v]) => [u, v]);
  EDGES.forEach(([a, b, w]) => {
    const pa = POS[a], pb = POS[b];
    const isCurrent = f.currentEdge && edgeKey(f.currentEdge[0], f.currentEdge[1]) === edgeKey(a, b);
    const accepted = isSameEdge(acceptedEdges, a, b);
    const rejected = isSameEdge(rejectedEdges, a, b);
    let stroke = "#cbd5e1", width = "3", dash = null;
    if (accepted) {
      stroke = "#16a34a";
      width = "6";
    } else if (rejected) {
      stroke = "#dc2626";
      width = "4";
      dash = "6 4";
    } else if (isCurrent && f.status === "examine") {
      stroke = "#2563eb";
      width = "5";
    }
    const line = el("line");
    line.setAttribute("x1", pa.x);
    line.setAttribute("y1", pa.y);
    line.setAttribute("x2", pb.x);
    line.setAttribute("y2", pb.y);
    line.setAttribute("stroke", stroke);
    line.setAttribute("stroke-width", width);
    if (dash) line.setAttribute("stroke-dasharray", dash);
    svg.append(line);
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const bg = el("rect");
    bg.setAttribute("x", mx - 10);
    bg.setAttribute("y", my - 11);
    bg.setAttribute("width", 20);
    bg.setAttribute("height", 16);
    bg.setAttribute("fill", "#ffffff");
    svg.append(bg);
    write(mx, my + 1, String(w), "calc");
  });

  VERTS.forEach((v) => {
    const p = POS[v];
    const color = colorOf[f.groups[v]];
    const circle = el("circle");
    circle.setAttribute("cx", p.x);
    circle.setAttribute("cy", p.y);
    circle.setAttribute("r", R);
    circle.setAttribute("fill", "#ffffff");
    circle.setAttribute("stroke", color);
    circle.setAttribute("stroke-width", "4");
    svg.append(circle);
    const t = el("text");
    t.setAttribute("x", p.x);
    t.setAttribute("y", p.y + 5);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "16");
    t.setAttribute("font-weight", "700");
    t.textContent = v;
    svg.append(t);
  });
}

function drawT(f) {
  const x0 = 30, y0 = 400;
  const s = f.T.length ? f.T.map(([u, v, w]) => `(${u},${v})[${w}]`).join(", ") : "∅";
  write(x0, y0, "T = { " + s + " }", "rowlabel");
}

function drawLegend() {
  const items = [
    {label: "検討中", color: "#2563eb", dash: null},
    {label: "採用", color: "#16a34a", dash: null},
    {label: "不採用(サイクル)", color: "#dc2626", dash: "6 4"},
    {label: "未検討", color: "#cbd5e1", dash: null}
  ];
  const x0 = 30, y0 = 430;
  items.forEach((it, i) => {
    const x = x0 + i * 165;
    const line = el("line");
    line.setAttribute("x1", x);
    line.setAttribute("y1", y0);
    line.setAttribute("x2", x + 24);
    line.setAttribute("y2", y0);
    line.setAttribute("stroke", it.color);
    line.setAttribute("stroke-width", "4");
    if (it.dash) line.setAttribute("stroke-dasharray", it.dash);
    svg.append(line);
    write(x + 32, y0 + 4, it.label, "rowlabel");
  });
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  drawGraph(f);
  drawT(f);
  drawLegend();
  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
</html>
