<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch05-chained-hash-search</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}
    svg{display:block;width:100%;aspect-ratio:720/430;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.edge{stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.edge.active{stroke:var(--active);stroke-width:5;marker-end:url(#arrow-active)}.bucket rect,.node rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:5}.bucket text,.node text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.bucket.active rect,.node.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.node.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:4}.marker{font-size:15px;font-weight:700;fill:var(--active)}.nil{font-size:15px;font-weight:700;fill:var(--muted)}
    .message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch05-chained-hash-search</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="10800" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 720 430" role="img" aria-label="外部ハッシュ法の探索アニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 10800,
  "code": [
    "int chained_hash_search(List L, int A[], string a) {",
    "    int x = A[h(a)];",
    "    while (x != NIL && L.key[x] != a) {",
    "        x = L.next[x];",
    "    }",
    "    return x;",
    "}"
  ],
  "frames": [
    {"at":0,"bucket":-1,"chain":["sun","sum"],"active":"","done":"","activeLink":-1,"codeLines":[0],"label":"key = \"sum\" を探索する","note":"外部ハッシュ法では, まず key が属するバケットを求める."},
    {"at":1800,"bucket":5,"chain":["sun","sum"],"active":"","done":"","activeLink":-1,"codeLines":[1],"label":"h(\"sum\") = 341 % 6 = 5","note":"int x = A[h(a)]; により, A[5] のチェーンを選択する."},
    {"at":3600,"bucket":5,"chain":["sun","sum"],"active":"sun","done":"","activeLink":0,"codeLines":[1,2],"label":"x は先頭セル \"sun\" を指す","note":"A[5] から得た最初の key を探索値と比較する."},
    {"at":5400,"bucket":5,"chain":["sun","sum"],"active":"sun","done":"","activeLink":1,"codeLines":[2,3],"label":"\"sun\" != \"sum\"","note":"一致しないため, x = L.next[x] で次セルへ進む."},
    {"at":7200,"bucket":5,"chain":["sun","sum"],"active":"sum","done":"","activeLink":-1,"codeLines":[2],"label":"x は \"sum\" を指す","note":"L.key[x] == a となり, while ループが終了する."},
    {"at":9000,"bucket":5,"chain":["sun","sum"],"active":"","done":"sum","activeLink":-1,"codeLines":[5],"label":"探索成功: return x","note":"key が \"sum\" のセルを返す."}
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}function text(x,y,value,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=value;svg.append(t)}
    function render(ms){const f=script.frames[frameIndexAt(ms)];svg.innerHTML="";const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs);for(let i=0;i<=6;i++){const y=35+i*52,g=el("g"),r=el("rect"),t=el("text");g.setAttribute("class",`bucket ${f.bucket===i?"active":""}`);g.setAttribute("transform",`translate(44 ${y})`);r.setAttribute("width","82");r.setAttribute("height","38");t.setAttribute("x","41");t.setAttribute("y","20");t.textContent=`A[${i}]`;g.append(r,t);svg.append(g)}const y=35+5*52+19,x0=205,w=110,gap=70;const first=el("line");first.setAttribute("x1","126");first.setAttribute("y1",y);first.setAttribute("x2",String(x0-8));first.setAttribute("y2",y);first.setAttribute("class",`edge ${f.activeLink===0?"active":""}`);svg.append(first);f.chain.forEach((value,i)=>{const x=x0+i*(w+gap),g=el("g"),r=el("rect"),t=el("text");if(i>0){const line=el("line");line.setAttribute("x1",String(x-gap+8));line.setAttribute("y1",y);line.setAttribute("x2",String(x-8));line.setAttribute("y2",y);line.setAttribute("class",`edge ${f.activeLink===i?"active":""}`);svg.append(line)}g.setAttribute("class",`node ${f.active===value?"active":""} ${f.done===value?"done":""}`);g.setAttribute("transform",`translate(${x} ${y-20})`);r.setAttribute("width",String(w));r.setAttribute("height","40");t.setAttribute("x",String(w/2));t.setAttribute("y","21");t.textContent=`\"${value}\"`;g.append(r,t);svg.append(g)});const end=el("line");end.setAttribute("x1","495");end.setAttribute("y1",y);end.setAttribute("x2","565");end.setAttribute("y2",y);end.setAttribute("class","edge");svg.append(end);text(580,y+5,"NIL","nil");if(f.active)text(x0+f.chain.indexOf(f.active)*(w+gap)+w/2,y-32,"x","marker");label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));seek.value=ms}
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});drawCode();render(0);
  </script>
</body>
</html>
