<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch06-digit-compute</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:720/360;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:6}.cell text{font-size:16px;font-weight:700;text-anchor:middle}.cell.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.cell.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:3}.marker{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--active)}.formula{font-size:18px;font-weight:700;fill:var(--ink)}.calc{font-size:16px;fill:var(--ink)}.rowlabel{font-size:13px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch06-digit-compute</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="12600" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 720 360" role="img" aria-label="k進表現の桁を求めるアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 12600,
  "code": ["void compute_digits(int x, int k, int d, int a[]) {","    int y = x;","    for (int p = 0; p <= d - 1; p++) {","        int q = y div k;","        a[p] = y - q * k;   // y mod k","        y = q;","    }","}"],
  "frames": [
    {"at":0,"p":-1,"y":355,"q":null,"ap":null,"a":[null,null,null,null,null],"codeLines":[0,1],"label":"compute_digits(355, 4, 5, a) を呼び出す","note":"x = 355, k = 4, d = 5 とする. y = x = 355 から始める."},
    {"at":1800,"p":0,"y":355,"q":88,"ap":3,"a":[3,null,null,null,null],"codeLines":[3,4,5],"label":"p = 0: q = 355 div 4 = 88","note":"a[0] = 355 - 88*4 = 3 (= 355 mod 4). 続いて y を商 88 に更新する."},
    {"at":3600,"p":1,"y":88,"q":22,"ap":0,"a":[3,0,null,null,null],"codeLines":[3,4,5],"label":"p = 1: q = 88 div 4 = 22","note":"a[1] = 88 - 22*4 = 0. y を 22 に更新する."},
    {"at":5400,"p":2,"y":22,"q":5,"ap":2,"a":[3,0,2,null,null],"codeLines":[3,4,5],"label":"p = 2: q = 22 div 4 = 5","note":"a[2] = 22 - 5*4 = 2. 講義資料の例と一致する."},
    {"at":7200,"p":3,"y":5,"q":1,"ap":1,"a":[3,0,2,1,null],"codeLines":[3,4,5],"label":"p = 3: q = 5 div 4 = 1","note":"a[3] = 5 - 1*4 = 1. y を 1 に更新する."},
    {"at":9000,"p":4,"y":1,"q":0,"ap":1,"a":[3,0,2,1,1],"codeLines":[3,4,5],"label":"p = 4: q = 1 div 4 = 0","note":"a[4] = 1 - 0*4 = 1. y = 0 になり, ループが終わる."},
    {"at":10800,"p":-1,"y":0,"q":null,"ap":null,"a":[3,0,2,1,1],"codeLines":[7],"label":"計算完了","note":"a[4..0] = 1,1,2,0,3 なので 355 = 11203₄ である. 低い桁から順に商を更新するので, 毎回 k^p で割り直す必要がない."}
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function render(ms){
      const f=script.frames[frameIndexAt(ms)];
      svg.innerHTML="";
      write(30,44,"x = 355, k = 4, d = 5","formula");
      write(30,80,`y = ${f.y}`,"calc");
      if(f.q!==null)write(30,110,`q = y div k = ${f.q}`,"calc");
      if(f.ap!==null)write(30,138,`a[${f.p}] = y - q*k = ${f.ap}`,"calc");
      write(30,186,"a[] (a[4] が最上位, a[0] が最下位)","rowlabel");
      const x0=30,w=110,gap=14,order=[4,3,2,1,0];
      order.forEach((p,idx)=>{
        const x=x0+idx*(w+gap),filled=f.a[p]!==null,active=f.p===p,g=el("g"),r=el("rect"),t=el("text");
        g.setAttribute("class",`cell ${active?"active":""} ${filled&&!active?"done":""}`);
        g.setAttribute("transform",`translate(${x} 200)`);
        r.setAttribute("width",w);r.setAttribute("height",44);
        t.setAttribute("x",w/2);t.setAttribute("y",28);
        t.textContent=filled?f.a[p]:"?";
        g.append(r,t);svg.append(g);
        write(x+w/2,266,`a[${p}]`,"marker");
      });
      label.textContent=f.label;note.textContent=f.note;
      [...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));
      seek.value=ms;
    }
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
</html>
