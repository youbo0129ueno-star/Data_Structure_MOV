  <style>

l:#dbeafe;stroke:var(--active);stroke-width:4}.node.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:4}.marker{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--active)}.formula{font-size:16px;font-weight:700;fill:var(--ink)}.calc{font-size:16px;fill:var(--ink)}.rowlabel{font-size:13px;font-weight:700;fill:var(--muted)}.nil{font-size:15px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}

  <main>
    <header>

      <div class="controls" aria-label="再生コントロール">

    </header>

    "            for (int k = i; k <= j - 1; k++) {",
    "                int q = m[i][k] + m[k+1][j] + p[i-1] * p[k] * p[j];",

  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
const P = [5, 4, 6, 2, 7];
const CELL_W = 76, CELL_H = 48;
const GRID_X0 = 210, GRID_Y0 = 168;

function findFilled(f, i, j){
  return f.filled.find((c) => c[0] === i && c[1] === j);
}
function isRef(f, i, j){
  return (f.ref || []).some((c) => c[0] === i && c[1] === j);
}
function isHighlight(f, i, j){
  return f.highlight && f.highlight[0] === i && f.highlight[1] === j;
}

function render(ms){
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";

  write(24, 28, "行列サイズ p = (p0,...,p4) = (5, 4, 6, 2, 7)", "formula");
  const labels = ["A1: 5x4", "A2: 4x6", "A3: 6x2", "A4: 2x7"];
  labels.forEach((s, i) => write(30 + i * 130, 54, s, "calc"));

  for (let c = 0; c < 4; c++){
    const x = GRID_X0 + c * CELL_W + (CELL_W - 8) / 2;
    write(x, GRID_Y0 - 16, "j=" + (c + 1), "marker");
  }

  for (let r = 0; r < 4; r++){
    const y = GRID_Y0 + r * CELL_H;
    write(GRID_X0 - 24, y + (CELL_H - 8) / 2 + 5, "i=" + (r + 1), "rowlabel");
    for (let c = 0; c < 4; c++){
      const i = r + 1, j = c + 1;
      const x = GRID_X0 + c * CELL_W;
      if (i > j) continue; // lower triangle unused
      const cellFilled = findFilled(f, i, j);
      const ref = isRef(f, i, j);
      const hi = isHighlight(f, i, j);
      const g = el("g");
      let cls = "cell";
      if (hi) cls += " active";
      else if (cellFilled) cls += " filled";
      g.setAttribute("class", cls);
      const rect = el("rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y);
      rect.setAttribute("width", CELL_W - 8); rect.setAttribute("height", CELL_H - 8);
      if (!hi && ref){
        rect.style.stroke = "#f97316";
        rect.style.strokeWidth = "4";
      }
      g.append(rect);
      const t = el("text");
      t.setAttribute("x", x + (CELL_W - 8) / 2);
      t.setAttribute("y", y + (CELL_H - 8) / 2 + 2);
      t.textContent = cellFilled ? String(cellFilled[2]) : "";
      g.append(t);
      if (cellFilled && cellFilled[3] !== null && cellFilled[3] !== undefined){
        const st = el("text");
        st.setAttribute("x", x + (CELL_W - 8) / 2);
        st.setAttribute("y", y + (CELL_H - 8) - 4);
        st.setAttribute("class", "nil");
        st.textContent = "s=" + cellFilled[3];
        g.append(st);
      }
      svg.append(g);
    }
  }

  const legendY = GRID_Y0 + 4 * CELL_H + 34;
  write(GRID_X0, legendY, "青 = 今計算中のセル / 緑 = 確定済みのセル / オレンジ枠 = 勝った k が参照したセル", "rowlabel");

  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
