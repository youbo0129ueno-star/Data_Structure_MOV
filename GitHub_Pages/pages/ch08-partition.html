<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch08-partition</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:720/300;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:6}.cell text{font-size:14px;font-weight:700;text-anchor:middle}.cell.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.cell.bucketActive rect{fill:#ffedd5;stroke:var(--swap);stroke-width:4}.cell.filled rect,.cell.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:3}.edge{stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.edge.active{stroke:var(--active);stroke-width:5;marker-end:url(#arrow-active)}.bucket rect,.node rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:5}.bucket text,.node text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.bucket.active rect,.node.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.node.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:4}.marker{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--active)}.formula{font-size:16px;font-weight:700;fill:var(--ink)}.calc{font-size:16px;fill:var(--ink)}.rowlabel{font-size:13px;font-weight:700;fill:var(--muted)}.nil{font-size:15px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch08-partition</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="18500" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 720 300" role="img" aria-label="クイックソートのPartition(Lomuto型の2ポインタ版)を配列上で可視化するアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 18500,
  "code": [
    "int partition(int A[], int p, int r) {",
    "    int x = A[p];",
    "    int i = p;",
    "    int j = r;",
    "",
    "    while (true) {",
    "        while (A[j] > x) {",
    "            j = j - 1;",
    "        }",
    "        while (A[i] < x) {",
    "            i = i + 1;",
    "        }",
    "        if (i < j) {",
    "            swap(A[i], A[j]);",
    "            i = i + 1;",
    "            j = j - 1;",
    "        } else {",
    "            return j;",
    "        }",
    "    }",
    "}"
  ],
  "frames": [
    {
      "at": 0,
      "arr": [
        15,
        16,
        2,
        12,
        3,
        4,
        11,
        18,
        1,
        23
      ],
      "i": 0,
      "j": 9,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        1,
        2,
        3
      ],
      "label": "初期化",
      "note": "x = A[p] = 15 を基準値とし, i = p = 0, j = r = 9 から探索を始める."
    },
    {
      "at": 1500,
      "arr": [
        15,
        16,
        2,
        12,
        3,
        4,
        11,
        18,
        1,
        23
      ],
      "i": 0,
      "j": 8,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        6,
        7,
        8
      ],
      "label": "j を左へ",
      "note": "A[9] = 23 > 15 なので j を1つ左へ. A[8] = 1 は15以下なので止まる (j = 8)."
    },
    {
      "at": 3000,
      "arr": [
        15,
        16,
        2,
        12,
        3,
        4,
        11,
        18,
        1,
        23
      ],
      "i": 0,
      "j": 8,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        9,
        10,
        11
      ],
      "label": "i を右へ",
      "note": "A[0] = 15 は15未満ではないので, i は動かず 0 のまま止まる."
    },
    {
      "at": 4500,
      "arr": [
        1,
        16,
        2,
        12,
        3,
        4,
        11,
        18,
        15,
        23
      ],
      "i": 1,
      "j": 7,
      "x": 15,
      "swapIdx": [
        0,
        8
      ],
      "scanIdx": null,
      "final": false,
      "codeLines": [
        12,
        13,
        14,
        15
      ],
      "label": "交換 (1回目)",
      "note": "i < j (0 < 8) なので A[0] と A[8] を交換し, i = 1, j = 7 へ進める."
    },
    {
      "at": 6000,
      "arr": [
        1,
        16,
        2,
        12,
        3,
        4,
        11,
        18,
        15,
        23
      ],
      "i": 1,
      "j": 6,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        6,
        7,
        8
      ],
      "label": "j を左へ",
      "note": "A[7] = 18 > 15 なので j を1つ左へ. A[6] = 11 は15以下なので止まる (j = 6)."
    },
    {
      "at": 7500,
      "arr": [
        1,
        16,
        2,
        12,
        3,
        4,
        11,
        18,
        15,
        23
      ],
      "i": 1,
      "j": 6,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        9,
        10,
        11
      ],
      "label": "i を右へ",
      "note": "A[1] = 16 は15未満ではないので, i は動かず 1 のまま止まる."
    },
    {
      "at": 9000,
      "arr": [
        1,
        11,
        2,
        12,
        3,
        4,
        16,
        18,

        23
      ],
      "i": 2,
      "j": 5,
      "x": 15,
      "swapIdx": [
        1,

      ],
      "scanIdx": null,
      "final": false,
      "codeLines": [
        12,
        13,
        14,
        15
      ],
      "label": "交換 (2回目)",
      "note": "i < j (1 < 6) なので A[1] と A[6] を交換し, i = 2, j = 5 へ進める."
    },
    {
      "at": 10500,
      "arr": [
        1,
        11,
        2,
        12,
        3,
        4,
        16,
        18,
        15,
        23
      ],
      "i": 2,
      "j": 5,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        6,
        7,
        8
      ],
      "label": "j を左へ",
      "note": "A[5] = 4 は15以下なので, j は動かず 5 のまま止まる."
    },
    {
      "at": 12000,
      "arr": [
        1,
        11,
        2,
        12,
        3,
        4,
        16,
        18,
        15,
        23
      ],
      "i": 6,
      "j": 5,
      "x": 15,
      "swapIdx": null,
      "scanIdx": [
        2,
        6
      ],
      "final": false,
      "codeLines": [
        9,
        10,
        11
      ],
      "label": "i を右へ",
      "note": "A[2]〜A[5] はいずれも15未満なので, i は 6 まで一気に進む. A[6] = 16 で止まる."
    },
    {
      "at": 13500,
      "arr": [
        1,
        11,
        2,
        12,
        3,
        4,
        16,
        18,
        15,
        23
      ],
      "i": 6,
      "j": 5,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        12,
        16,
        17
      ],
      "label": "停止条件",
      "note": "i < j が成り立たない (6 < 5 は偽) ので else に進み, j の値を返す."
    },
    {
      "at": 15000,
      "arr": [
        1,
        11,
        2,
        12,
        3,
        4,
        16,
        18,
        15,
        23
      ],
      "i": 6,
      "j": 5,
      "x": 15,
      "swapIdx": null,
      "scanIdx": null,
      "final": false,
      "codeLines": [
        17
      ],
      "label": "返り値",
      "note": "partition は q = 5 を返す. 以降 quicksort(A, 0, 5) と quicksort(A, 6, 9) を再帰的に呼び出す."
    },
    {
      "at": 16500,
      "arr": [
        1,
        11,
        2,
        12,
        3,

        23
      ],
      "i": 6,
      "j": 5,
      "x": 15,

      "scanIdx": null,
      "final": true,
      "codeLines": [
        17
      ],
      "label": "分割完了",
      "note": "A[0..5] は x = 15 以下 (緑), A[6..9] は x = 15 以上 (橙) に分かれた. 本文の図と同じ結果になる."
    }
  ]
}

  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
const CELL_W = 60, CELL_H = 46, X0 = 46, Y = 118;

function cellBox(x, y, w, h, fill, stroke, strokeWidth) {
  const r = el("rect");
  r.setAttribute("x", x); r.setAttribute("y", y);
  r.setAttribute("width", w); r.setAttribute("height", h);
  r.setAttribute("rx", 6);
  r.setAttribute("fill", fill); r.setAttribute("stroke", stroke);
  r.setAttribute("stroke-width", strokeWidth);
  return r;
}

function pointerArrow(x, y1, y2, color, text) {
  const ln = el("line");
  ln.setAttribute("x1", x); ln.setAttribute("y1", y1);
  ln.setAttribute("x2", x); ln.setAttribute("y2", y2);
  ln.setAttribute("stroke", color); ln.setAttribute("stroke-width", 3);
  ln.setAttribute("marker-end", "url(#arrow-active)");
  svg.append(ln);
  write(x, y1 + 18, text, "marker");
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  arrowDefs();

  write(360, 26, "x = " + f.x + " (基準値)", "formula");
  write(360, 46, "A[p]", "rowlabel");

  f.arr.forEach((v, k) => {
    const x = X0 + k * CELL_W;
    let fill = "#fff", stroke = "#94a3b8", sw = 2;
    if (f.final) {
      if (k <= f.q) { fill = "#dcfce7"; stroke = "#16a34a"; sw = 3; }
      else { fill = "#ffedd5"; stroke = "#f97316"; sw = 3; }
    }
    if (f.swapIdx && f.swapIdx.includes(k)) { stroke = "#f97316"; sw = 4; }
    if (f.scanIdx && k >= f.scanIdx[0] && k <= f.scanIdx[1]) { stroke = "#2563eb"; sw = 3; }
    svg.append(cellBox(x, Y, CELL_W - 8, CELL_H, fill, stroke, sw));
    write(x + (CELL_W - 8) / 2, Y + CELL_H / 2 + 5, String(v), "calc");
    write(x + (CELL_W - 8) / 2, Y - 10, String(k), "marker");
  });

  // pointer arrows below the array
  const iX = X0 + f.i * CELL_W + (CELL_W - 8) / 2;
  const jX = X0 + f.j * CELL_W + (CELL_W - 8) / 2;
  pointerArrow(iX, Y + CELL_H + 34, Y + CELL_H + 6, "#2563eb", "i");
  pointerArrow(jX, Y + CELL_H + 34, Y + CELL_H + 6, "#f97316", "j");

  if (f.final) {
    write(360, Y + CELL_H + 80, "戻り値 q = " + f.q, "formula");
  }

  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
