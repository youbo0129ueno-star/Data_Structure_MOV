    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
const GPOS = {
  a: {x: 60, y: 190},
  b: {x: 150, y: 110},
  c: {x: 150, y: 270},
  e: {x: 240, y: 110},
  f: {x: 240, y: 270},
  h: {x: 320, y: 190}
};
const GEDGES = [
  ["a", "b", 1], ["a", "c", 7], ["b", "e", 2], ["b", "c", 5],
  ["c", "f", 2], ["e", "f", 5], ["e", "h", 2], ["f", "h", 4]
];
const VERTS = ["a", "b", "c", "e", "f", "h"];
const GR = 16;
const TARGET = "h";
const FILL = {unvisited: "#ffffff", candidate: "#dbeafe", settled: "#dcfce7"};
const STROKE = {unvisited: "#94a3b8", candidate: "#2563eb", settled: "#16a34a"};

function edgeKey(a, b) { return [a, b].sort().join("-"); }
function hasEdge(list, a, b) { return (list || []).some((e) => edgeKey(e[0], e[1]) === edgeKey(a, b)); }

function drawGraph(f) {
  GEDGES.forEach(([a, b, w]) => {
    const pa = GPOS[a], pb = GPOS[b];
    const active = hasEdge(f.activeEdges, a, b);
    const line = el("line");
    line.setAttribute("x1", pa.x); line.setAttribute("y1", pa.y);
    line.setAttribute("x2", pb.x); line.setAttribute("y2", pb.y);
    line.setAttribute("stroke", active ? "#2563eb" : "#cbd5e1");
    line.setAttribute("stroke-width", active ? "4" : "2");
    svg.append(line);
  });
  VERTS.forEach((v) => {
    const p = GPOS[v], st = f.status[v];
    const c = el("circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", GR);
    c.setAttribute("fill", FILL[st]); c.setAttribute("stroke", STROKE[st]);
    c.setAttribute("stroke-width", v === f.activeVertex ? "4" : "2");
    svg.append(c);
    if (v === TARGET) {
      const ring = el("circle");
      ring.setAttribute("cx", p.x); ring.setAttribute("cy", p.y); ring.setAttribute("r", GR + 5);
      ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#f97316");
      ring.setAttribute("stroke-width", "2"); ring.setAttribute("stroke-dasharray", "3 3");
      svg.append(ring);
    }
    const t = el("text");
    t.setAttribute("x", p.x); t.setAttribute("y", p.y + 4);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "13"); t.setAttribute("font-weight", "700");
    t.textContent = v;
    svg.append(t);
    write(p.x, p.y + GR + 14, "d=" + (f.d[v] === null ? "∞" : f.d[v]), "marker");
  });
  write(60, 40, "本文の例グラフ (再掲)", "rowlabel");
}

const SLOT = [
  {x: 560, y: 90},
  {x: 480, y: 170},
  {x: 640, y: 170}
];

function drawHeap(f) {
  write(420, 40, "ヒープ H (根 = 最小 key)", "rowlabel");
  // edges between heap nodes (tree shape) for current size
  const n = f.heap.length;
  if (n >= 2) {
    const line = el("line");
    line.setAttribute("x1", SLOT[0].x); line.setAttribute("y1", SLOT[0].y);
    line.setAttribute("x2", SLOT[1].x); line.setAttribute("y2", SLOT[1].y);
    line.setAttribute("stroke", "#94a3b8"); line.setAttribute("stroke-width", "2");
    svg.append(line);
  }
  if (n >= 3) {
    const line = el("line");
    line.setAttribute("x1", SLOT[0].x); line.setAttribute("y1", SLOT[0].y);
    line.setAttribute("x2", SLOT[2].x); line.setAttribute("y2", SLOT[2].y);
    line.setAttribute("stroke", "#94a3b8"); line.setAttribute("stroke-width", "2");
    svg.append(line);
  }
  f.heap.forEach((cell, i) => {
    const p = SLOT[i];
    const isSwapped = f.swapped.includes(cell.v);
    const circle = el("circle");
    circle.setAttribute("cx", p.x); circle.setAttribute("cy", p.y); circle.setAttribute("r", 28);
    circle.setAttribute("fill", isSwapped ? "#ffedd5" : "#dbeafe");
    circle.setAttribute("stroke", isSwapped ? "#f97316" : "#2563eb");
    circle.setAttribute("stroke-width", isSwapped ? "5" : "3");
    svg.append(circle);
    const t1 = el("text");
    t1.setAttribute("x", p.x); t1.setAttribute("y", p.y - 2);
    t1.setAttribute("text-anchor", "middle"); t1.setAttribute("font-size", "15"); t1.setAttribute("font-weight", "700");
    t1.textContent = cell.v;
    svg.append(t1);
    const t2 = el("text");
    t2.setAttribute("x", p.x); t2.setAttribute("y", p.y + 15);
    t2.setAttribute("text-anchor", "middle"); t2.setAttribute("font-size", "12"); t2.setAttribute("fill", "#475569");
    t2.textContent = "key=" + cell.key;
    svg.append(t2);
    write(p.x, p.y - 38, "H[" + i + "]", "rowlabel");
  });
  if (n === 0) {
    write(560, 130, "(空)", "nil");
  }
}

function drawTable(f) {
  const x0 = 420, y0 = 230, rowH = 24;
  write(x0, y0, "頂点", "rowlabel");
  write(x0 + 50, y0, "d", "rowlabel");
  write(x0 + 90, y0, "pi", "rowlabel");
  write(x0 + 140, y0, "adr", "rowlabel");
  write(x0 + 190, y0, "状態", "rowlabel");
  VERTS.forEach((v, i) => {
    const y = y0 + 22 + i * rowH;
    write(x0, y, v, "calc");
    write(x0 + 50, y, f.d[v] === null ? "∞" : String(f.d[v]), "calc");
    write(x0 + 90, y, f.pi[v] === null ? "NIL" : f.pi[v], "calc");
    write(x0 + 140, y, f.adr[v] === null ? "NIL" : String(f.adr[v]), "calc");
    const stJa = {unvisited: "未到達", candidate: "候補(H内)", settled: "確定"}[f.status[v]];
    const t = el("text");
    t.setAttribute("x", x0 + 190); t.setAttribute("y", y);
    t.setAttribute("font-size", "13"); t.setAttribute("fill", STROKE[f.status[v]]); t.setAttribute("font-weight", "700");
    t.textContent = stJa;
    svg.append(t);
  });
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  drawGraph(f);
  drawHeap(f);
  drawTable(f);
  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
