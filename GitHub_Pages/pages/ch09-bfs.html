<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch09-bfs</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:800/460;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:6}.cell text{font-size:14px;font-weight:700;text-anchor:middle}.cell.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.cell.bucketActive rect{fill:#ffedd5;stroke:var(--swap);stroke-width:4}.cell.filled rect,.cell.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:3}.edge{stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.edge.active{stroke:var(--active);stroke-width:5;marker-end:url(#arrow-active)}.bucket rect,.node rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:5}.bucket text,.node text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.bucket.active rect,.node.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.node.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:4}.marker{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--active)}.formula{font-size:16px;font-weight:700;fill:var(--ink)}.calc{font-size:16px;fill:var(--ink)}.rowlabel{font-size:13px;font-weight:700;fill:var(--muted)}.nil{font-size:15px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch09-bfs</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="9900" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 800 460" role="img" aria-label="幅優先探索 BFS の頂点発見とキューの遷移のアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 9900,
  "code": [
    "void BFS(Graph G, Vertex s) {",
    "    for each v in V - {s} {",
    "        color[v] = white;",
    "        d[v] = INF;",
    "        pi[v] = NIL;",
    "    }",
    "    color[s] = gray;",
    "    d[s] = 0;",
    "    pi[s] = NIL;",
    "    make queue Q empty;",
    "    enqueue(Q, s);",
    "",
    "    while (Q is not empty) {",
    "        Vertex v = dequeue(Q);",
    "        for each u adjacent to v {",
    "            if (color[u] == white) {",
    "                color[u] = gray;",
    "                d[u] = d[v] + 1;",
    "                pi[u] = v;",
    "                enqueue(Q, u);",
    "            }",
    "        }",
    "        color[v] = black;",
    "    }",
    "}"
  ],
  "frames": [
    {
      "at": 0,
      "codeLines": [
        1,
        2,
        3,
        4,
        5
      ],
      "colors": {
        "v1": "white",
        "v2": "white",
        "v3": "white",
        "v4": "white"
      },
      "d": {
        "v1": "INF",
        "v2": "INF",
        "v3": "INF",
        "v4": "INF"
      },
      "queue": [],
      "activeVertex": null,
      "activeEdge": null,
      "label": "初期化",
      "note": "本文図の無向グラフ (v1, v2, v3, v4, 辺 v1-v2, v1-v3, v2-v3, v3-v4, v1-v4) を使う. 始点 s = v1 以外の全頂点を white に, d を INF に初期化する."
    },
    {
      "at": 900,
      "codeLines": [
        6,
        7,
        8,
        9,
        10
      ],
      "colors": {
        "v1": "gray",
        "v2": "white",
        "v3": "white",
        "v4": "white"
      },
      "d": {
        "v1": 0,
        "v2": "INF",
        "v3": "INF",
        "v4": "INF"
      },
      "queue": [
        "v1"
      ],
      "activeVertex": "v1",
      "activeEdge": null,
      "label": "始点 v1 を発見",
      "note": "color[v1] = gray, d[v1] = 0 とし, キュー Q に v1 を入れる."
    },
    {
      "at": 1800,
      "codeLines": [
        12,
        13,
        14
      ],
      "colors": {
        "v1": "gray",
        "v2": "white",
        "v3": "white",
        "v4": "white"
      },
      "d": {
        "v1": 0,
        "v2": "INF",
        "v3": "INF",
        "v4": "INF"
      },
      "queue": [],
      "activeVertex": "v1",
      "activeEdge": null,
      "label": "v1 を取り出す",
      "note": "Q から v1 を取り出し, v1 に隣接する頂点 (v2, v3, v4) を順に調べる."
    },
    {
      "at": 2700,
      "codeLines": [
        15,
        16,
        17,
        18,
        19
      ],
      "colors": {
        "v1": "gray",
        "v2": "gray",
        "v3": "white",
        "v4": "white"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": "INF",
        "v4": "INF"
      },
      "queue": [
        "v2"
      ],
      "activeVertex": "v1",
      "activeEdge": [
        "v1",
        "v2"
      ],
      "label": "v2 を発見",
      "note": "v2 は white なので color[v2] = gray, d[v2] = d[v1] + 1 = 1, pi[v2] = v1 とし, Q に入れる."
    },
    {
      "at": 3600,
      "codeLines": [
        15,
        16,
        17,
        18,
        19
      ],
      "colors": {
        "v1": "gray",
        "v2": "gray",
        "v3": "gray",
        "v4": "white"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": "INF"
      },
      "queue": [
        "v2",
        "v3"
      ],
      "activeVertex": "v1",
      "activeEdge": [
        "v1",
        "v3"
      ],
      "label": "v3 を発見",
      "note": "v3 も white なので color[v3] = gray, d[v3] = 1, pi[v3] = v1 とし, Q に入れる."
    },
    {
      "at": 4500,
      "codeLines": [
        15,
        16,
        17,
        18,
        19
      ],
      "colors": {
        "v1": "gray",
        "v2": "gray",
        "v3": "gray",
        "v4": "gray"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": 1
      },
      "queue": [
        "v2",
        "v3",
        "v4"
      ],
      "activeVertex": "v1",
      "activeEdge": [
        "v1",
        "v4"
      ],
      "label": "v4 を発見",
      "note": "v4 も white なので color[v4] = gray, d[v4] = 1, pi[v4] = v1 とし, Q に入れる."
    },
    {
      "at": 5400,
      "codeLines": [
        22
      ],
      "colors": {
        "v1": "black",
        "v2": "gray",
        "v3": "gray",
        "v4": "gray"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": 1
      },
      "queue": [
        "v2",
        "v3",
        "v4"
      ],
      "activeVertex": "v1",
      "activeEdge": null,
      "label": "v1 の処理完了",
      "note": "v1 の隣接頂点をすべて調べ終えたので color[v1] = black にする."
    },
    {
      "at": 6300,
      "codeLines": [
        13,
        14,
        15,
        22
      ],
      "colors": {
        "v1": "black",
        "v2": "black",
        "v3": "gray",
        "v4": "gray"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": 1
      },
      "queue": [
        "v3",
        "v4"
      ],
      "activeVertex": "v2",
      "activeEdge": null,
      "label": "v2 を取り出す",
      "note": "v2 の隣接頂点は v1 (black) と v3 (gray) で, どちらも white ではないので新たに発見される頂点はない. color[v2] = black にする."
    },
    {
      "at": 7200,
      "codeLines": [
        13,
        14,
        15,
        22
      ],
      "colors": {
        "v1": "black",
        "v2": "black",
        "v3": "black",
        "v4": "gray"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": 1
      },
      "queue": [
        "v4"
      ],
      "activeVertex": "v3",
      "activeEdge": null,
      "label": "v3 を取り出す",
      "note": "v3 の隣接頂点 v1, v2, v4 はすべて white ではない. color[v3] = black にする."
    },
    {
      "at": 8100,
      "codeLines": [
        13,
        14,
        15,
        22
      ],
      "colors": {
        "v1": "black",
        "v2": "black",
        "v3": "black",
        "v4": "black"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": 1
      },
      "queue": [],
      "activeVertex": "v4",
      "activeEdge": null,
      "label": "v4 を取り出す",
      "note": "v4 の隣接頂点 v3, v1 もすべて white ではない. color[v4] = black にし, Q が空になったので終了する."
    },
    {
      "at": 9000,
      "codeLines": [
        23,
        24
      ],
      "colors": {
        "v1": "black",
        "v2": "black",
        "v3": "black",
        "v4": "black"
      },
      "d": {
        "v1": 0,
        "v2": 1,
        "v3": 1,
        "v4": 1
      },
      "queue": [],
      "activeVertex": null,
      "activeEdge": null,
      "label": "探索終了",
      "note": "全頂点が black になった. d[v1]=0, d[v2]=d[v3]=d[v4]=1 で, これらは s = v1 からの最短辺数を表す."
    }
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
const POS = {
  v1: {x: 190, y: 90},
  v2: {x: 80, y: 230},
  v3: {x: 190, y: 370},
  v4: {x: 320, y: 230}
};
const EDGES = [["v1", "v2"], ["v1", "v3"], ["v2", "v3"], ["v3", "v4"], ["v1", "v4"]];
const R = 30;
const COLOR_FILL = {white: "#ffffff", gray: "#dbeafe", black: "#dcfce7"};
const COLOR_STROKE = {white: "#94a3b8", gray: "#2563eb", black: "#16a34a"};

function sameEdge(e, a, b) {
  if (!e) return false;
  return (e[0] === a && e[1] === b) || (e[0] === b && e[1] === a);
}

function drawGraph(f) {
  EDGES.forEach(([a, b]) => {
    const pa = POS[a], pb = POS[b];
    const line = el("line");
    line.setAttribute("x1", pa.x);
    line.setAttribute("y1", pa.y);
    line.setAttribute("x2", pb.x);
    line.setAttribute("y2", pb.y);
    const active = sameEdge(f.activeEdge, a, b);
    line.setAttribute("stroke", active ? "#2563eb" : "#94a3b8");
    line.setAttribute("stroke-width", active ? "5" : "3");
    svg.append(line);
  });
  Object.keys(POS).forEach((v) => {
    const p = POS[v];
    const c = f.colors[v];
    const circle = el("circle");
    circle.setAttribute("cx", p.x);
    circle.setAttribute("cy", p.y);
    circle.setAttribute("r", R);
    circle.setAttribute("fill", COLOR_FILL[c]);
    circle.setAttribute("stroke", COLOR_STROKE[c]);
    circle.setAttribute("stroke-width", v === f.activeVertex ? "5" : "3");
    svg.append(circle);
    const t = el("text");
    t.setAttribute("x", p.x);
    t.setAttribute("y", p.y + 5);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "16");
    t.setAttribute("font-weight", "700");
    t.textContent = v;
    svg.append(t);
    write(p.x, p.y + R + 20, "d=" + f.d[v], "marker");
  });
}

function drawQueue(f) {
  write(430, 60, "キュー Q (先頭 → 末尾)", "rowlabel");
  const x0 = 430, y0 = 76, w = 62, h = 40;
  for (let i = 0; i < 5; i++) {
    const g = el("g");
    g.setAttribute("class", "cell");
    const r = el("rect");
    r.setAttribute("x", x0 + i * (w + 6));
    r.setAttribute("y", y0);
    r.setAttribute("width", w);
    r.setAttribute("height", h);
    g.append(r);
    const t = el("text");
    t.setAttribute("x", x0 + i * (w + 6) + w / 2);
    t.setAttribute("y", y0 + h / 2 + 5);
    t.textContent = f.queue[i] ? f.queue[i] : "";
    g.append(t);
    svg.append(g);
  }
}

function drawLegend() {
  const items = [
    {c: "white", label: "未発見"},
    {c: "gray", label: "発見済み・キュー内"},
    {c: "black", label: "処理完了"}
  ];
  items.forEach((it, i) => {
    const y = 150 + i * 34;
    const circle = el("circle");
    circle.setAttribute("cx", 450);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", 12);
    circle.setAttribute("fill", COLOR_FILL[it.c]);
    circle.setAttribute("stroke", COLOR_STROKE[it.c]);
    circle.setAttribute("stroke-width", "3");
    svg.append(circle);
    write(475, y + 5, it.label, "rowlabel");
  });
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  drawGraph(f);
  drawQueue(f);
  drawLegend();
  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
</html>
