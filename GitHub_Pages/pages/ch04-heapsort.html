<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch04-heapsort</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--sorted:#16a34a;--swap:#f97316;--heap:#dbeafe;--code:#eef2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}
    svg{display:block;width:100%;aspect-ratio:720/390;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:3;rx:7}.cell text{font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}.cell.heap rect{fill:var(--heap);stroke:var(--active)}.cell.sorted rect{fill:#dcfce7;stroke:var(--sorted)}.cell.swap rect{fill:#ffedd5;stroke:var(--swap);stroke-width:5}.brace{stroke:#64748b;stroke-width:3;stroke-linecap:round}.marker{font-size:16px;font-weight:700;text-anchor:middle;fill:var(--active)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}
    @media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header><h1>ch04-heapsort</h1><div class="controls" aria-label="再生コントロール"><button id="play" type="button">再生</button><button id="restart" type="button">最初へ</button><label class="speed-label">速度<select id="speed" aria-label="再生速度"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select></label><input id="seek" type="range" min="0" max="19000" value="0" step="20" aria-label="再生位置"></div></header>
    <section class="stage"><svg id="view" viewBox="0 0 720 390" role="img" aria-label="ヒープソートのアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 19000,
  "code": [
    "void heapsort(int A[], int n) {",
    "    build_heap(A, A, n);",
    "    for (int i = 1; i <= n - 1; i++) {",
    "        swap(A[0], A[n - i]);",
    "        downheap_sort(A, n - i - 1);",
    "    }",
    "}"
  ],
  "frames": [
    {"at":0,"values":[15,16,2,12,3,4,11,18,1,23],"heapEnd":-1,"sortedStart":10,"swap":[],"codeLines":[0],"label":"入力配列 A","note":"まず配列全体から最大ヒープを作る."},
    {"at":1800,"values":[23,18,11,15,16,2,4,12,1,3],"heapEnd":9,"sortedStart":10,"swap":[],"codeLines":[1],"label":"Build-Heap 完了","note":"A[0] から A[9] までは最大ヒープであり, 根 A[0] に最大値 23 がある."},
    {"at":3800,"values":[23,18,11,15,16,2,4,12,1,3],"heapEnd":9,"sortedStart":10,"swap":[0,9],"codeLines":[2,3],"label":"根 23 と末尾 3 を交換する","note":"交換前に一旦停止し, 最大値 23 が整列済み領域へ移ることを確認する."},
    {"at":6000,"values":[3,18,11,15,16,2,4,12,1,23],"heapEnd":8,"sortedStart":9,"swap":[],"codeLines":[3],"label":"23 が右端に固定される","note":"右端 A[9] は整列済み領域になる. 左側 A[0] から A[8] まではまだヒープ性が壊れている."},
    {"at":8200,"values":[18,16,11,15,3,2,4,12,1,23],"heapEnd":8,"sortedStart":9,"swap":[],"codeLines":[4],"label":"Downheap-Sort でヒープ性を回復する","note":"未整列区間 A[0] から A[8] までだけをヒープとして扱う."},
    {"at":10400,"values":[18,16,11,15,3,2,4,12,1,23],"heapEnd":8,"sortedStart":9,"swap":[0,8],"codeLines":[2,3],"label":"次の根 18 と末尾 1 を交換する","note":"次に最大の 18 を, 整列済み領域の左隣へ移す."},
    {"at":12600,"values":[1,16,11,15,3,2,4,12,18,23],"heapEnd":7,"sortedStart":8,"swap":[],"codeLines":[3],"label":"18 が A[8] に固定される","note":"整列済み領域は A[8..9] に広がる."},
    {"at":14800,"values":[16,15,11,12,3,2,4,1,18,23],"heapEnd":7,"sortedStart":8,"swap":[],"codeLines":[4],"label":"残り A[0] から A[7] までを再びヒープにする","note":"根を取り除くたびに, Downheap-Sort が局所的な破れを下へ押し下げる."},
    {"at":17000,"values":[1,2,3,4,11,12,15,16,18,23],"heapEnd":-1,"sortedStart":0,"swap":[],"codeLines":[5,6],"label":"整列完了","note":"同じ操作を繰り返すと, 整列済み区間が配列全体になり, 昇順の配列が得られる."}
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}function frameAt(ms){return script.frames[frameIndexAt(ms)]}function render(ms){const idx=frameIndexAt(ms),f=script.frames[idx],next=script.frames[idx+1],swap=f.swap??[],moving=swap.length===2&&next;const span=moving?Math.max(1,next.at-f.at):1,t=moving?Math.min(1,Math.max(0,(ms-f.at)/span)):0;svg.innerHTML="";const x0=46,y=150,w=60,gap=8;function cellX(i){let x=x0+i*(w+gap);if(!moving||!swap.includes(i))return x;const other=swap[0]===i?swap[1]:swap[0];return x+(x0+other*(w+gap)-x)*t}f.values.forEach((v,i)=>{const g=el("g");g.setAttribute("class",["cell",i<=f.heapEnd?"heap":"",i>=f.sortedStart?"sorted":"",swap.includes(i)?"swap":""].join(" "));g.setAttribute("transform",`translate(${cellX(i)} ${y})`);const r=el("rect");r.setAttribute("width",w);r.setAttribute("height",72);const txt=el("text");txt.setAttribute("x",w/2);txt.setAttribute("y",36);txt.textContent=v;g.append(r,txt);svg.append(g);const ix=el("text");ix.setAttribute("x",x0+i*(w+gap)+w/2);ix.setAttribute("y",y+102);ix.setAttribute("class","marker");ix.textContent=i;svg.append(ix)});function brace(a,b,txt,yy){if(a>b)return;const x1=x0+a*(w+gap),x2=x0+b*(w+gap)+w,path=el("path");path.setAttribute("class","brace");path.setAttribute("fill","none");path.setAttribute("d",`M${x1},${yy} L${x2},${yy}`);svg.append(path);const txtEl=el("text");txtEl.setAttribute("x",(x1+x2)/2);txtEl.setAttribute("y",yy-12);txtEl.setAttribute("class","marker");txtEl.textContent=txt;svg.append(txtEl)}brace(0,f.heapEnd,"ヒープ領域",112);brace(f.sortedStart,9,"整列済み",285);label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));seek.value=ms}function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});drawCode();render(0);
  </script>
</body>
</html>
