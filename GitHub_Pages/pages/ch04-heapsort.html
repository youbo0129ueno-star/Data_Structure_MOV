<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch04-heapsort</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--sorted:#16a34a;--swap:#f97316;--heap:#dbeafe;--code:#eef2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}
    svg{display:block;width:100%;aspect-ratio:720/390;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:3;rx:7}.cell text{font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}.cell.heap rect{fill:var(--heap);stroke:var(--active)}.cell.sorted rect{fill:#dcfce7;stroke:var(--sorted)}.cell.swap rect{fill:#ffedd5;stroke:var(--swap);stroke-width:5}.cell.active rect{fill:#fef3c7;stroke:#d97706;stroke-width:5}.brace{stroke:#64748b;stroke-width:3;stroke-linecap:round}.marker{font-size:16px;font-weight:700;text-anchor:middle;fill:var(--active)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}
    @media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header><h1>ch04-heapsort</h1><div class="controls" aria-label="再生コントロール"><button id="play" type="button">再生</button><button id="restart" type="button">最初へ</button><label class="speed-label">速度<select id="speed" aria-label="再生速度"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select></label><input id="seek" type="range" min="0" value="0" step="20" aria-label="再生位置"></div></header>
    <section class="stage"><svg id="view" viewBox="0 0 720 390" role="img" aria-label="ヒープソートのアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script>
    const script={code:['void heapsort(int A[], int n) {','    build_heap(A, A, n);','    for (int i = 1; i <= n - 1; i++) {','        swap(A[0], A[n - i]);','        downheap_sort(A, n - i - 1);','    }','}'],frames:[]};
    const A=[23,18,11,15,16,2,4,12,1,3],n=A.length; let at=0;
    function add(values,heapEnd,sortedStart,active,swap,codeLines,label,note){script.frames.push({at,values:[...values],heapEnd,sortedStart,active,swap,codeLines,label,note});at+=1500;}
    add(A,9,10,[],[],[0,1],'Build-Heap 完了','A[0] から A[9] は最大ヒープである. 以後は, 根の最大値を右端へ 1 個ずつ確定させる.');
    for(let i=1;i<n;i++){
      const target=n-i; add(A,target,target+1,[0,target],[0,target],[2,3],`i = ${i}: 根 A[0] と A[${target}] を交換する`,`根はヒープ領域 A[0] から A[${target}] の最大値である.`);
      [A[0],A[target]]=[A[target],A[0]]; const end=target-1; add(A,end,target,[],[0,target],[3],`${A[target]} が A[${target}] に確定する`,`右側 A[${target}] から A[9] は整列済みとなる. 左側では根だけがヒープ性を壊している.`);
      let u=0; add(A,end,target,[u],[],[4],`downheap_sort(A, ${end}) を始める`,`u = 0 から下へ進み, 親・左の子・右の子の最大を根側へ上げる.`);
      while(true){
        const l=2*u+1,r=2*u+2; let largest=u; const children=[u]; if(l<=end)children.push(l); if(r<=end)children.push(r);
        add(A,end,target,children,[],[4],`u = ${u}: 親と子を比較する`,`左の子は ${l<=end?'A['+l+'] = '+A[l]:'範囲外'}, 右の子は ${r<=end?'A['+r+'] = '+A[r]:'範囲外'}である.`);
        if(l<=end&&A[l]>A[largest])largest=l; if(r<=end&&A[r]>A[largest])largest=r;
        if(largest===u){add(A,end,target,[u],[],[4],`u = ${u}: 親が最大なので Downheap 完了`,`この部分木でヒープ性が回復した. 次の i で, 残ったヒープから次の最大値を取り出す.`);break;}
        add(A,end,target,[],[u,largest],[4],`A[${u}] と A[${largest}] を交換する`,`より大きい子 ${A[largest]} を上げ, 値 ${A[u]} を下げる.`); [A[u],A[largest]]=[A[largest],A[u]]; u=largest;
        add(A,end,target,[u],[],[4],`u = ${u} としてさらに下を調べる`,`下げられた値だけがヒープ性を壊す可能性があるため, 同じ比較を続ける.`);
      }
    }
    add(A,-1,0,[],[],[5,6],'整列完了','根と末尾の交換, Downheap の回復を繰り返し, 配列全体が昇順になった.'); script.durationMs=at-1500;
    const svg=document.getElementById('view'),code=document.getElementById('code'),label=document.getElementById('label'),note=document.getElementById('note'),play=document.getElementById('play'),restart=document.getElementById('restart'),seek=document.getElementById('seek'),speed=document.getElementById('speed');let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS('http://www.w3.org/2000/svg',n)}function drawCode(){script.code.forEach(line=>{const s=document.createElement('span');s.className='line';s.textContent=line;code.append(s)})}function frameAt(ms){return script.frames.reduce((c,f)=>f.at<=ms?f:c,script.frames[0])}
    function render(ms){const f=frameAt(ms);svg.innerHTML='';const x0=46,y=150,w=60,gap=8;f.values.forEach((v,i)=>{const g=el('g');g.setAttribute('class',['cell',i<=f.heapEnd?'heap':'',i>=f.sortedStart?'sorted':'',f.active.includes(i)?'active':'',f.swap.includes(i)?'swap':''].join(' '));g.setAttribute('transform',`translate(${x0+i*(w+gap)} ${y})`);const r=el('rect');r.setAttribute('width',w);r.setAttribute('height',72);const t=el('text');t.setAttribute('x',w/2);t.setAttribute('y',36);t.textContent=v;g.append(r,t);svg.append(g);const ix=el('text');ix.setAttribute('x',x0+i*(w+gap)+w/2);ix.setAttribute('y',y+102);ix.setAttribute('class','marker');ix.textContent=i;svg.append(ix)});function brace(a,b,text,yy){if(a>b)return;const x1=x0+a*(w+gap),x2=x0+b*(w+gap)+w,p=el('path');p.setAttribute('class','brace');p.setAttribute('fill','none');p.setAttribute('d',`M${x1},${yy} L${x2},${yy}`);svg.append(p);const t=el('text');t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',yy-12);t.setAttribute('class','marker');t.textContent=text;svg.append(t)}brace(0,f.heapEnd,'ヒープ領域',112);brace(f.sortedStart,9,'整列済み',285);label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle('active',f.codeLines.includes(i)));seek.value=ms;}
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent='再生';return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent='一時停止';startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent='再生';cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener('click',()=>playing?pause():start());restart.addEventListener('click',()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener('input',()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener('change',()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});seek.max=script.durationMs;drawCode();render(0);
  </script>
</body>
</html>
