<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒープソート: 取り出しとDownheapを追う</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#cbd5e1; --panel:#f8fafc; --blue:#2563eb; --green:#16a34a; --orange:#ea580c; --red:#dc2626; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#fff; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; }
    main { width:min(1180px,calc(100vw - 32px)); margin:24px auto; display:grid; grid-template-columns:minmax(500px,1.18fr) minmax(340px,.82fr); gap:22px; }
    header { grid-column:1/-1; border-bottom:1px solid var(--line); padding-bottom:14px; } h1 { margin:0 0 6px; font-size:24px; } header p { margin:0; color:var(--muted); }
    .stage,.code-panel { padding:18px; border:1px solid var(--line); border-radius:10px; background:var(--panel); } .stage { min-height:560px; }
    .state { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }.chip { padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:#fff; font:600 14px ui-monospace,SFMono-Regular,monospace; }.chip strong { color:var(--blue); }
    .array-title { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:14px 0 8px; }.array-title h2 { margin:0; font-size:18px; }.array-title span { color:var(--muted); font-size:14px; }
    .array { display:flex; gap:7px; align-items:flex-start; min-height:132px; padding:14px 6px 8px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; overflow-x:auto; }.cell-wrap { width:60px; min-width:60px; text-align:center; }.mark { height:23px; color:var(--blue); font:700 13px ui-monospace,SFMono-Regular,monospace; }.cell { height:58px; display:grid; place-items:center; border:3px solid #94a3b8; border-radius:8px; background:#fff; font:700 20px ui-monospace,SFMono-Regular,monospace; }.cell.heap { border-color:var(--blue); background:#dbeafe; }.cell.sorted { border-color:var(--green); background:#dcfce7; }.cell.active { border-color:var(--orange); background:#ffedd5; }.cell.swap { border-color:var(--red); background:#fee2e2; }.index { margin-top:6px; color:var(--muted); font:12px ui-monospace,SFMono-Regular,monospace; }
    .ranges { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }.range { padding:9px 11px; border-left:4px solid; background:#fff; line-height:1.55; font-size:14px; }.heap-range { border-color:var(--blue); }.sorted-range { border-color:var(--green); }
    .message { min-height:112px; padding:14px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; }.message h2 { margin:0 0 8px; font-size:18px; }.message p { margin:0; color:var(--muted); line-height:1.65; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }button { padding:9px 14px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font:inherit; cursor:pointer; }button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }button:disabled { opacity:.45; cursor:not-allowed; }#counter { margin-left:auto; color:var(--muted); font-size:14px; }
    h3 { margin:0 0 8px; font-size:16px; } h3 + pre { margin-bottom:18px; } pre { margin:0; overflow:auto; counter-reset:line; font:13px/1.62 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }.line { display:block; padding:0 8px; border-left:3px solid transparent; white-space:pre; }.line::before { counter-increment:line; content:counter(line); display:inline-block; width:2ch; margin-right:14px; color:#94a3b8; text-align:right; }.line.active { border-left-color:var(--blue); background:#dbeafe; }
    .legend { margin:0; padding:0; list-style:none; color:var(--muted); font-size:14px; line-height:1.8; }.legend b { display:inline-block; width:12px; height:12px; margin-right:6px; border:2px solid; border-radius:3px; vertical-align:-1px; }
    @media(max-width:820px) { main { grid-template-columns:1fr; }.ranges { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>ヒープソート: 1個ずつ確定させる</h1><p>「次へ」で, 根と末尾の交換だけでなく, その後の <code>downheap_sort</code> の比較・交換をすべて追う.</p></header>
    <section class="stage" aria-live="polite">
      <div id="state" class="state"></div>
      <div class="array-title"><h2>配列 <code>A</code></h2><span>青: ヒープ領域, 緑: 確定済みの整列領域</span></div>
      <div id="array" class="array" aria-label="配列の状態"></div>
      <div class="ranges"><div id="heap-range" class="range heap-range"></div><div id="sorted-range" class="range sorted-range"></div></div>
      <div class="message"><h2 id="label"></h2><p id="note"></p></div>
      <div class="controls"><button id="prev" type="button">← 前へ</button><button id="next" type="button">次へ →</button><button id="restart" type="button">最初へ</button><span id="counter"></span></div>
    </section>
    <aside class="code-panel"><h3>Heapsort</h3><pre><code id="heap-code"></code></pre><h3>Downheap-Sort</h3><pre><code id="down-code"></code></pre><ul class="legend"><li><b style="border-color:#2563eb;background:#dbeafe"></b>最大ヒープとして扱う区間</li><li><b style="border-color:#16a34a;background:#dcfce7"></b>右端から増える整列済み区間</li><li><b style="border-color:#ea580c;background:#ffedd5"></b>比較中の添字</li><li><b style="border-color:#dc2626;background:#fee2e2"></b>交換する添字</li></ul></aside>
  </main>
  <script>
    const heapCode = ['void heapsort(int A[], int n) {','    build_heap(A, A, n);','    for (int i = 1; i <= n - 1; i++) {','        swap(A[0], A[n - i]);','        downheap_sort(A, n - i - 1);','    }','}'];
    const downCode = ['void downheap_sort(int H[], int end) {','    int u = 0;','    while (true) {','        int l = 2 * u + 1;','        int r = 2 * u + 2;','        int largest = u;','        if (l <= end && H[l] > H[largest]) largest = l;','        if (r <= end && H[r] > H[largest]) largest = r;','        if (largest == u) break;','        swap(H[u], H[largest]);','        u = largest;','    }','}'];
    const initialHeap = [23,18,11,15,16,2,4,12,1,3];
    const steps = [], copy = a => [...a];
    function add({values, i='-', u='-', end, active=[], swap=[], heapLines=[], downLines=[], label, note}) { steps.push({values:copy(values), i, u, end, active, swap, heapLines, downLines, label, note}); }
    function makeSteps() {
      const A = copy(initialHeap), n = A.length;
      add({values:A, end:n-1, heapLines:[0,1], label:'Build-Heap 完了: ここから Heapsort を開始する', note:'A[0..9] は最大ヒープである. したがって根 A[0] = 23 が全体の最大値であり, 右端へ確定させられる.'});
      for (let i = 1; i < n; i++) {
        const target = n - i;
        add({values:A, i, end:target, active:[0,target], heapLines:[2,3], label:`外側ループ i = ${i}: 根 A[0] と A[${target}] を交換する`, note:`未確定のヒープ領域は A[0..${target}] である. 根はこの範囲の最大値なので, 末尾 A[${target}] へ移す.`});
        [A[0], A[target]] = [A[target], A[0]];
        const end = target - 1;
        add({values:A, i, end, swap:[0,target], heapLines:[3], label:`最大値 ${A[target]} が A[${target}] に確定する`, note:`A[${target}..${n-1}] は昇順の整列済み区間であり, 以後は変更しない. ただし新しい根 A[0] によりヒープ性が壊れている.`});
        let u = 0;
        add({values:A, i, u, end, active:[u], heapLines:[4], downLines:[0,1], label:`downheap_sort(A, ${end}) を呼ぶ`, note:`根から下へ進み, 親より大きい子があれば交換する. 壊れうる場所は, 交換後の値がいる経路だけである.`});
        while (true) {
          const l = 2*u + 1, r = 2*u + 2;
          let largest = u;
          add({values:A, i, u, end, active:[u], downLines:[2,3,4,5], label:`u = ${u}: 左右の子の添字を求める`, note:`左の子 l = ${l <= end ? l : '範囲外'}, 右の子 r = ${r <= end ? r : '範囲外'}. 親 u 自身を最大候補 largest として比較を始める.`});
          if (l <= end) { add({values:A, i, u, end, active:[u,l], downLines:[6], label:`H[${l}] = ${A[l]} と H[${largest}] = ${A[largest]} を比較する`, note:`${A[l] > A[largest] ? `左の子 ${A[l]} の方が大きいので largest = ${l} にする.` : `親 ${A[largest]} 以上ではないので largest は ${largest} のままである.`}`}); if (A[l] > A[largest]) largest = l; }
          if (r <= end) { add({values:A, i, u, end, active:[u,r,largest], downLines:[7], label:`H[${r}] = ${A[r]} と H[${largest}] = ${A[largest]} を比較する`, note:`${A[r] > A[largest] ? `右の子 ${A[r]} が最大なので largest = ${r} にする.` : `最大候補 H[${largest}] = ${A[largest]} は右の子以上である.`}`}); if (A[r] > A[largest]) largest = r; }
          if (largest === u) { add({values:A, i, u, end, active:[u], downLines:[8], label:`largest = u = ${u}: Downheap 完了`, note:'親が左右の子以上なので, この位置でヒープ性が回復している. 次の外側ループで, さらに1個小さい最大値を取り出す.'}); break; }
          add({values:A, i, u, end, swap:[u,largest], downLines:[9], label:`H[${u}] = ${A[u]} と H[${largest}] = ${A[largest]} を交換する`, note:'より大きい子を上げ, 小さい親を下げる. これにより根側のヒープ性を回復する.'});
          [A[u], A[largest]] = [A[largest], A[u]];
          u = largest;
          add({values:A, i, u, end, active:[u], downLines:[10], label:`u = ${u} として, さらに下を確認する`, note:'下げられた値だけがヒープ性を壊している可能性があるため, この頂点から同じ処理を繰り返す.'});
        }
      }
      add({values:A, end:-1, heapLines:[5,6], label:'完了: 配列全体が昇順に整列された', note:'各回でヒープの最大値を右端へ確定させたため, 整列済み区間が右から左へ配列全体へ広がった.'});
    }
    const array=document.getElementById('array'), state=document.getElementById('state'), label=document.getElementById('label'), note=document.getElementById('note'), prev=document.getElementById('prev'), next=document.getElementById('next'), counter=document.getElementById('counter'); let position=0;
    function draw(lines, target) { lines.forEach(line => { const s=document.createElement('span'); s.className='line'; s.textContent=line; target.append(s); }); }
    function chip(n,v) { return `<span class="chip"><strong>${n}</strong> = ${v}</span>`; }
    function render() { const s=steps[position], n=s.values.length; state.innerHTML=[chip('i',s.i),chip('u',s.u),chip('heap end',s.end)].join(''); array.innerHTML=''; s.values.forEach((value,index)=>{ const w=document.createElement('div'); w.className='cell-wrap'; const mark=document.createElement('div'); mark.className='mark'; mark.textContent=`${index===s.u?'u ':''}${index===0&&s.i!=='-'?'root':''}`; const cell=document.createElement('div'); cell.className=`cell${index<=s.end?' heap':''}${index>s.end?' sorted':''}${s.active.includes(index)?' active':''}${s.swap.includes(index)?' swap':''}`; cell.textContent=value; const ix=document.createElement('div'); ix.className='index'; ix.textContent=`A[${index}]`; w.append(mark,cell,ix); array.append(w); }); document.getElementById('heap-range').innerHTML=s.end>=0?`<b>ヒープ領域:</b> A[0] から A[${s.end}]`:'<b>ヒープ領域:</b> なし'; document.getElementById('sorted-range').innerHTML=s.end<n-1?`<b>整列済み区間:</b> A[${s.end+1}] から A[${n-1}]`:'<b>整列済み区間:</b> まだなし'; label.textContent=s.label; note.textContent=s.note; [...document.getElementById('heap-code').children].forEach((e,i)=>e.classList.toggle('active',s.heapLines.includes(i))); [...document.getElementById('down-code').children].forEach((e,i)=>e.classList.toggle('active',s.downLines.includes(i))); prev.disabled=position===0; next.disabled=position===steps.length-1; counter.textContent=`${position+1} / ${steps.length}`; }
    makeSteps(); draw(heapCode,document.getElementById('heap-code')); draw(downCode,document.getElementById('down-code')); render(); prev.addEventListener('click',()=>{position--;render();}); next.addEventListener('click',()=>{position++;render();}); document.getElementById('restart').addEventListener('click',()=>{position=0;render();});
  </script>
</body>
</html>
