<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch04-downheap-sort</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}
    svg{display:block;width:100%;aspect-ratio:720/430;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.edge{stroke:#94a3b8;stroke-width:3;stroke-linecap:round}.node circle{fill:#fff;stroke:#94a3b8;stroke-width:3}.node text{font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}.node.active circle{fill:#dbeafe;stroke:var(--active);stroke-width:5}.node.swap circle{fill:#ffedd5;stroke:var(--swap);stroke-width:5}.node.done circle{fill:#dcfce7;stroke:var(--done)}.node.out circle{fill:#f8fafc;stroke:#cbd5e1;stroke-dasharray:7 6}.marker{font-size:15px;font-weight:700;text-anchor:middle;fill:var(--active)}
    .message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}
    @media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header><h1>ch04-downheap-sort</h1><div class="controls" aria-label="再生コントロール"><button id="play" type="button">再生</button><button id="restart" type="button">最初へ</button><label class="speed-label">速度<select id="speed" aria-label="再生速度"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select></label><input id="seek" type="range" min="0" max="16000" value="0" step="20" aria-label="再生位置"></div></header>
    <section class="stage"><svg id="view" viewBox="0 0 720 430" role="img" aria-label="Downheap-Sort のアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 16000,
  "positions": [[360,70],[230,160],[490,160],[165,260],[295,260],[425,260],[555,260],[130,350],[200,350]],
  "edges": [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6],[3,7],[3,8]],
  "code": [
    "void downheap_sort(int H[], int i) {",
    "    int u = 0;",
    "    while (true) {",
    "        int l = (left(u) <= i) ? left(u) : u;",
    "        int r = (right(u) <= i) ? right(u) : u;",
    "        int largest = u;",
    "        if (H[l] > H[largest]) largest = l;",
    "        if (H[r] > H[largest]) largest = r;",
    "        if (largest == u) break;",
    "        swap(H[u], H[largest]);",
    "        u = largest;",
    "    }",
    "}"
  ],
  "frames": [
    {"at":0,"values":[3,18,11,15,16,2,4,12,1],"u":0,"swap":[],"done":[],"codeLines":[0,1],"label":"根に 3 を移した直後","note":"根と子の間だけでヒープ性が壊れている可能性がある."},
    {"at":2000,"values":[3,18,11,15,16,2,4,12,1],"u":0,"swap":[0,1],"done":[],"codeLines":[3,4,5,6,7],"label":"子 18 と 11 を比べ, 18 を選ぶ","note":"交換前に一旦停止し, 3 と 18 が入れ替わることを確認する."},
    {"at":4200,"values":[18,3,11,15,16,2,4,12,1],"u":1,"swap":[],"done":[0],"codeLines":[9,10],"label":"3 が添字 1 へ下がる","note":"交換後に壊れうるのは, u = 1 とその子の間だけである."},
    {"at":6400,"values":[18,3,11,15,16,2,4,12,1],"u":1,"swap":[1,4],"done":[0],"codeLines":[3,4,6,7],"label":"子 15 と 16 を比べ, 16 を選ぶ","note":"3 より大きい子のうち最大は 16 である. 次に 3 と 16 を交換する."},
    {"at":8600,"values":[18,16,11,15,3,2,4,12,1],"u":4,"swap":[],"done":[0,1],"codeLines":[9,10],"label":"3 が添字 4 へ下がる","note":"u = 4 は子を持たないため, 次の判定で停止できる."},
    {"at":10800,"values":[18,16,11,15,3,2,4,12,1],"u":4,"swap":[],"done":[0,1],"codeLines":[3,4,8],"label":"子がないので交換しない","note":"left(4), right(4) はヒープ範囲外であり, largest は u のままである."},
    {"at":13200,"values":[18,16,11,15,3,2,4,12,1],"u":4,"swap":[],"done":[0,1,2,3,4,5,6,7,8],"codeLines":[11],"label":"Downheap-Sort 完了","note":"すべての親子関係がヒープ性を満たした."}
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}function frameAt(ms){return script.frames[frameIndexAt(ms)]}function render(ms){const idx=frameIndexAt(ms),f=script.frames[idx],next=script.frames[idx+1],swap=f.swap??[],moving=swap.length===2&&next;const span=moving?Math.max(1,next.at-f.at):1,t=moving?Math.min(1,Math.max(0,(ms-f.at)/span)):0;svg.innerHTML="";script.edges.forEach(([a,b])=>{const pa=script.positions[a],pb=script.positions[b],line=el("line");line.setAttribute("class","edge");line.setAttribute("x1",pa[0]);line.setAttribute("y1",pa[1]);line.setAttribute("x2",pb[0]);line.setAttribute("y2",pb[1]);svg.append(line)});function pos(i){const p=script.positions[i];if(!moving||!swap.includes(i))return p;const other=swap[0]===i?swap[1]:swap[0],q=script.positions[other];return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t]}f.values.forEach((v,i)=>{const p=script.positions[i],q=pos(i),g=el("g");g.setAttribute("class",["node",f.u===i?"active":"",swap.includes(i)?"swap":"",f.done.includes(i)?"done":""].join(" "));g.setAttribute("transform",`translate(${q[0]} ${q[1]})`);const c=el("circle");c.setAttribute("r",27);const txt=el("text");txt.textContent=v;g.append(c,txt);svg.append(g);const ix=el("text");ix.setAttribute("x",p[0]);ix.setAttribute("y",p[1]+45);ix.setAttribute("class","marker");ix.textContent=i;svg.append(ix)});label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));seek.value=ms}function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});drawCode();render(0);
  </script>
</body>
</html>
