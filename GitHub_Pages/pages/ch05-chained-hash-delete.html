<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch05-chained-hash-delete</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:720/430;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.edge{stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.edge.active{stroke:var(--done);stroke-width:5;marker-end:url(#arrow-done)}.bucket rect,.node rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:5}.bucket text,.node text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.bucket.active rect,.node.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.node.remove rect{fill:#fee2e2;stroke:#dc2626;stroke-width:4;stroke-dasharray:6 4}.marker{font-size:15px;font-weight:700;fill:var(--active);text-anchor:middle}.nil{font-size:15px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch05-chained-hash-delete</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="10800" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 720 430" role="img" aria-label="外部ハッシュ法の削除アニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 10800,
  "code": ["void chained_hash_delete(List L, int A[], int x) {","    int y = A[h(L.key[x])];","    int z = NIL;","    while (y != x) {","        z = y; y = L.next[y];","    }","    if (z == NIL) A[h(L.key[x])] = L.next[x];","    else L.next[z] = L.next[x];","}"],
  "frames": [
    {"at":0,"chain":["ant","bee","cow"],"active":"","remove":"bee","bridge":false,"codeLines":[0,1,2],"label":"x = \"bee\" を削除する","note":"A[4] のチェーンから, 削除対象の直前セルを探す."},
    {"at":1800,"chain":["ant","bee","cow"],"active":"ant","remove":"bee","bridge":false,"codeLines":[3,4],"label":"y = \"ant\" を調べる","note":"y は x ではないので, z = y として次へ進む."},
    {"at":3600,"chain":["ant","bee","cow"],"active":"bee","remove":"bee","bridge":false,"codeLines":[3,5],"label":"z = \"ant\", y = \"bee\"","note":"y が削除対象 x に到達した. z は直前セルを保持している."},
    {"at":5400,"chain":["ant","bee","cow"],"active":"bee","remove":"bee","bridge":true,"codeLines":[7],"label":"L.next[z] = L.next[x]","note":"\"ant\" の next を \"cow\" へ張り替える."},
    {"at":7200,"chain":["ant","cow"],"active":"","remove":"","bridge":false,"codeLines":[7],"label":"\"bee\" が経路から外れる","note":"A[4] -> \"ant\" -> \"cow\" -> NIL が残る."},
    {"at":9000,"chain":["ant","cow"],"active":"","remove":"","bridge":false,"codeLines":[8],"label":"削除完了","note":"チェーンの前後関係を保ったまま x を取り除いた."}
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}function txt(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function render(ms){const f=script.frames[frameIndexAt(ms)];svg.innerHTML="";const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-done","#16a34a"));svg.append(defs);for(let i=0;i<=6;i++){const y=34+i*52,g=el("g"),r=el("rect"),t=el("text");g.setAttribute("class",`bucket ${i===4?"active":""}`);g.setAttribute("transform",`translate(30 ${y})`);r.setAttribute("width","76");r.setAttribute("height","38");t.setAttribute("x","38");t.setAttribute("y","20");t.textContent=`A[${i}]`;g.append(r,t);svg.append(g)}const y=34+4*52+19,x0=150,w=100,gap=48;function link(x1,y1,x2,y2,on){const l=el("line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class",`edge ${on?"active":""}`);svg.append(l)}link(106,y,x0-7,y,false);f.chain.forEach((value,i)=>{const x=x0+i*(w+gap),g=el("g"),r=el("rect"),t=el("text");if(i>0)link(x-gap+7,y,x-7,y,false);g.setAttribute("class",`node ${f.active===value?"active":""} ${f.remove===value?"remove":""}`);g.setAttribute("transform",`translate(${x} ${y-20})`);r.setAttribute("width",w);r.setAttribute("height","40");t.setAttribute("x",w/2);t.setAttribute("y","21");t.textContent=`\"${value}\"`;g.append(r,t);svg.append(g)});if(f.bridge){const p=el("path");p.setAttribute("d",`M ${x0+w} ${y-25} Q ${x0+w+gap+w/2} ${y-82} ${x0+2*(w+gap)} ${y-25}`);p.setAttribute("class","edge active");svg.append(p)}const endX=x0+(f.chain.length-1)*(w+gap)+w;link(endX,y,endX+12,y,false);txt(endX+28,y+5,"NIL","nil");if(f.active)txt(x0+f.chain.indexOf(f.active)*(w+gap)+w/2,y-31,f.active==="bee"?"y = x":"y, z","marker");label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));seek.value=ms}
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});drawCode();render(0);
  </script>
</body>
</html>
