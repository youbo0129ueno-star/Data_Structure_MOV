  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
    const CELL_W = 54, CELL_H = 36;
    const A_X0 = 64, A_Y = 60;
    const C_X0 = 204, C_Y = 190;
    const B_X0 = 64, B_Y = 320;
    function row(values, x0, y, activeIdx, rowLabel, colorFilled){
      write(24, y + CELL_H / 2 + 5, rowLabel, "rowlabel");
      values.forEach((v, i) => {
        const x = x0 + i * CELL_W;
        const isActive = i === activeIdx;
        const isFilled = v !== null && v !== undefined;
        const g = el("g");
        g.setAttribute("class", ["cell", isActive ? "active" : "", (colorFilled && isFilled && !isActive) ? "filled" : ""].join(" ").trim());
        const r = el("rect");
        r.setAttribute("x", x); r.setAttribute("y", y);
        r.setAttribute("width", CELL_W - 6); r.setAttribute("height", CELL_H);
        g.append(r);
        const t = el("text");
        t.setAttribute("x", x + (CELL_W - 6) / 2);
        t.setAttribute("y", y + CELL_H / 2 + 5);
        t.textContent = isFilled ? String(v) : "";
        g.append(t);
        svg.append(g);
        write(x + (CELL_W - 6) / 2, y - 6, String(i), "marker");
      });
    }
    function render(ms){
      const idx = frameIndexAt(ms), f = script.frames[idx];
      svg.innerHTML = "";
      const sorted = ms >= script.durationMs - 1400;
      row(f.a, A_X0, A_Y, f.activeA, "A", sorted);
      row(f.c, C_X0, C_Y, -1, "C", false);
      row(f.b, B_X0, B_Y, f.activeB, "B", true);
      label.textContent = f.label;
      note.textContent = f.note;
      highlightCode(f);
      seek.value = ms;
    }
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
