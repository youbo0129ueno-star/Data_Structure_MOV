    "void dijkstra(Graph G, Vertex s, Vertex t) {",
    "    for each v in V - {s} {",
    "        d[v] = INF;",
    "        pi[v] = NIL;",
    "    }",
    "    d[s] = 0;",
    "    pi[s] = NIL;",
    "    A = {s};",
    "",
    "    while (A is not empty) {",
    "        v = vertex in A with minimum d[v];",
    "        remove v from A;",
    "        if (v == t) {",
    "            output d[t];",
    "            return;",
    "        }",
    "",
    "        for each w adjacent to v {",
    "            if (d[w] == INF) {",
    "                d[w] = d[v] + l(v, w);",
    "                pi[w] = v;",
    "                insert w into A;",
    "            } else if (d[w] > d[v] + l(v, w)) {",
    "                d[w] = d[v] + l(v, w);",
    "                pi[w] = v;",
    "            }",
    "        }",
    "    }",

    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
const POS = {
  a: {x: 100, y: 210},
  b: {x: 230, y: 110},
  c: {x: 230, y: 310},
  e: {x: 360, y: 110},
  f: {x: 360, y: 310},
  h: {x: 480, y: 210}
};
const EDGES = [
  ["a", "b", 1],
  ["a", "c", 7],
  ["b", "e", 2],
  ["b", "c", 5],
  ["c", "f", 2],
  ["e", "f", 5],
  ["e", "h", 2],
  ["f", "h", 4]
];
const VERTS = ["a", "b", "c", "e", "f", "h"];
const R = 24;
const TARGET = "h";
const START = "a";

const FILL = {unvisited: "#ffffff", candidate: "#dbeafe", settled: "#dcfce7"};
const STROKE = {unvisited: "#94a3b8", candidate: "#2563eb", settled: "#16a34a"};

function edgeKey(a, b) {
  return [a, b].sort().join("-");
}

function hasEdge(list, a, b) {
  return (list || []).some((e) => edgeKey(e[0], e[1]) === edgeKey(a, b));
}

function drawGraph(f) {
  arrowDefs();
  EDGES.forEach(([a, b, w]) => {
    const pa = POS[a], pb = POS[b];
    const active = hasEdge(f.activeEdges, a, b);
    const onPath = hasEdge(f.pathEdges, a, b);
    const line = el("line");
    line.setAttribute("x1", pa.x);
    line.setAttribute("y1", pa.y);
    line.setAttribute("x2", pb.x);
    line.setAttribute("y2", pb.y);
    line.setAttribute("stroke", onPath ? "#f97316" : active ? "#2563eb" : "#94a3b8");
    line.setAttribute("stroke-width", onPath ? "6" : active ? "5" : "3");
    svg.append(line);
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const bg = el("rect");
    bg.setAttribute("x", mx - 10);
    bg.setAttribute("y", my - 11);
    bg.setAttribute("width", 20);
    bg.setAttribute("height", 16);
    bg.setAttribute("fill", "#ffffff");
    svg.append(bg);
    write(mx, my + 1, String(w), "calc");
  });
  VERTS.forEach((v) => {
    const p = POS[v];
    const st = f.status[v];
    const circle = el("circle");
    circle.setAttribute("cx", p.x);
    circle.setAttribute("cy", p.y);
    circle.setAttribute("r", R);
    circle.setAttribute("fill", FILL[st]);
    circle.setAttribute("stroke", STROKE[st]);
    circle.setAttribute("stroke-width", v === f.activeVertex ? "5" : "3");
    svg.append(circle);
    if (v === TARGET) {
      const ring = el("circle");
      ring.setAttribute("cx", p.x);
      ring.setAttribute("cy", p.y);
      ring.setAttribute("r", R + 6);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", "#f97316");
      ring.setAttribute("stroke-width", "2");
      ring.setAttribute("stroke-dasharray", "4 3");
      svg.append(ring);
    }
    const t = el("text");
    t.setAttribute("x", p.x);
    t.setAttribute("y", p.y + 5);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "16");
    t.setAttribute("font-weight", "700");
    t.textContent = v;
    svg.append(t);
    const dv = f.d[v];
    write(p.x, p.y + R + 20, "d=" + (dv === null || dv === undefined ? "∞" : dv), "marker");
    const label = v === START ? "s" : v === TARGET ? "t" : "";
    if (label) write(p.x, p.y - R - 10, label, "rowlabel");
  });
}

function drawTable(f) {
  const x0 = 540, y0 = 26, rowH = 26;
  write(x0, 12, "頂点ごとの状態", "rowlabel");
  write(x0, y0 + 4, "頂点", "rowlabel");
  write(x0 + 60, y0 + 4, "d", "rowlabel");
  write(x0 + 110, y0 + 4, "pi", "rowlabel");
  write(x0 + 170, y0 + 4, "状態", "rowlabel");
  VERTS.forEach((v, i) => {
    const y = y0 + 26 + i * rowH;
    write(x0, y, v, "calc");
    const dv = f.d[v];
    write(x0 + 60, y, dv === null || dv === undefined ? "∞" : String(dv), "calc");
    write(x0 + 110, y, f.pi[v] === null || f.pi[v] === undefined ? "NIL" : f.pi[v], "calc");
    const stJa = {unvisited: "未到達", candidate: "候補(A)", settled: "確定"}[f.status[v]];
    const t = el("text");
    t.setAttribute("x", x0 + 170);
    t.setAttribute("y", y);
    t.setAttribute("font-size", "14");
    t.setAttribute("fill", STROKE[f.status[v]]);
    t.setAttribute("font-weight", "700");
    t.textContent = stJa;
    svg.append(t);
  });
}

function drawA(f) {
  const x0 = 540, y0 = 232;
  write(x0, y0, "候補集合 A = { " + (f.A.length ? f.A.join(", ") : "∅") + " }", "rowlabel");
}

function drawPathOrder(f) {
  const x0 = 540, y0 = 264;
  write(x0, y0, "output_path の出力順:", "rowlabel");
  const s = f.pathOrder.length ? f.pathOrder.join(" → ") : "(まだ開始していません)";
  write(x0, y0 + 22, s, "formula");
}

function drawLegend() {
  const items = [
    {c: "unvisited", label: "未到達 (d=∞)"},
    {c: "candidate", label: "候補集合 A に所属"},
    {c: "settled", label: "距離が確定"}
  ];
  const x0 = 540, y0 = 316;
  items.forEach((it, i) => {
    const y = y0 + i * 26;
    const circle = el("circle");
    circle.setAttribute("cx", x0 + 8);
    circle.setAttribute("cy", y - 4);
    circle.setAttribute("r", 9);
    circle.setAttribute("fill", FILL[it.c]);
    circle.setAttribute("stroke", STROKE[it.c]);
    circle.setAttribute("stroke-width", "3");
    svg.append(circle);
    write(x0 + 26, y, it.label, "rowlabel");
  });
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  drawGraph(f);
  drawTable(f);
  drawA(f);
  drawPathOrder(f);
  drawLegend();
  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
</html>
