<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch03-rb-rotate</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #64748b;
      --panel: #f8fafc;
      --line: #cbd5e1;
      --active: #2563eb;
      --visited: #16a34a;
      --accent: #f97316;
      --warn: #dc2626;
      --black: #111827;
      --red: #dc2626;
      --nil: #94a3b8;
      --code: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      color: var(--ink);
      background: #ffffff;
    }

    main {
      display: grid;
      grid-template-columns: minmax(420px, 1.1fr) minmax(320px, 0.9fr);
      gap: 24px;
      width: min(1120px, calc(100vw - 32px));
      margin: 24px auto;
      align-items: start;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button,
    select {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      border-color: var(--active);
      color: var(--active);
    }

    .speed-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    input[type="range"] {
      width: 220px;
    }

    .stage,
    .side {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .stage {
      padding: 18px;
    }

    svg {
      display: block;
      width: 100%;
      aspect-ratio: 720 / 460;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .edge {
      stroke: #94a3b8;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke 180ms ease, stroke-width 180ms ease, opacity 180ms ease;
    }

    .edge.active-edge {
      stroke: var(--active);
      stroke-width: 5;
      opacity: 0.8;
    }

    .edge.new-edge {
      stroke: var(--accent);
      stroke-width: 5;
    }

    .edge.cut {
      stroke: var(--warn);
      stroke-width: 5;
      stroke-dasharray: 8 8;
      opacity: 0.42;
    }

    .node circle {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 3;
      transition: fill 180ms ease, stroke 180ms ease, opacity 180ms ease;
    }

    .node text {
      font-size: 22px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .node.seen circle,
    .node.visited circle {
      fill: #dcfce7;
      stroke: var(--visited);
    }

    .node.active circle {
      fill: #dbeafe;
      stroke: var(--active);
      stroke-width: 5;
    }

    .node.focus circle {
      fill: #ffedd5;
      stroke: var(--accent);
      stroke-width: 5;
    }

    .node.warn circle {
      fill: #fee2e2;
      stroke: var(--warn);
      stroke-width: 5;
    }

    .node.black circle {
      fill: var(--black);
      stroke: var(--black);
    }

    .node.black text {
      fill: #ffffff;
    }

    .node.red circle {
      fill: #fee2e2;
      stroke: var(--red);
      stroke-width: 4;
    }

    .node.ghost circle {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-dasharray: 6 6;
      opacity: 0.75;
    }

    .node.ghost text {
      fill: #94a3b8;
    }

    .nil-box {
      fill: #f8fafc;
      stroke: var(--nil);
      stroke-width: 2;
      stroke-dasharray: 5 5;
      rx: 6;
    }

    .nil-text {
      font-size: 15px;
      font-weight: 700;
      fill: var(--nil);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .pointer {
      font-size: 15px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .message {
      margin-top: 14px;
      min-height: 132px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .label {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .runtime {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .runtime-box {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .runtime-box strong {
      color: var(--ink);
    }

    .side {
      padding: 16px;
    }

    pre {
      margin: 0;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.6;
      counter-reset: line;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .line {
      display: block;
      min-height: 22px;
      padding: 0 8px;
      border-left: 3px solid transparent;
      white-space: pre;
    }

    .line::before {
      counter-increment: line;
      content: counter(line);
      display: inline-block;
      width: 2ch;
      margin-right: 16px;
      color: #94a3b8;
      text-align: right;
    }

    .line.active {
      background: var(--code);
      border-left-color: var(--active);
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
      }
    }

  </style>
</head>

<body>
  <main>
    <header>
      <h1>ch03-rb-rotate</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">
          速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" value="0" step="20" aria-label="再生位置">
      </div>
    </header>

    <section class="stage">
      <svg id="tree" viewBox="0 0 720 460" role="img" aria-label="二色木の左回転と右回転アニメーション"></svg>
      <div class="message">
        <p id="label" class="label"></p>
        <p id="note" class="note"></p>
        <div class="runtime">
          <div class="runtime-box"><strong>state:</strong> <span id="state"></span></div>
          <div class="runtime-box"><strong>output:</strong> <span id="output"></span></div>
          <div class="runtime-box"><strong>stack:</strong> <span id="stack"></span></div>
        </div>
      </div>
    </section>

    <aside class="side">
      <pre><code id="code"></code></pre>
    </aside>
  </main>

  <script>
    const script = JSON.parse(document.getElementById("framescript").textContent);
    const svg = document.getElementById("tree");
    const code = document.getElementById("code");
    const label = document.getElementById("label");
    const note = document.getElementById("note");
    const state = document.getElementById("state");
    const output = document.getElementById("output");
    const stack = document.getElementById("stack");
    const play = document.getElementById("play");
    const restart = document.getElementById("restart");
    const seek = document.getElementById("seek");
    const speed = document.getElementById("speed");

    const nodeEls = new Map();
    const edgeEls = new Map();
    let currentPositions = {};
    let startTime = 0;
    let elapsedBeforePlay = 0;
    let raf = 0;
    let playing = false;

    function svgEl(name) {
      return document.createElementNS("http://www.w3.org/2000/svg", name);
    }

    function edgeKey(edge) {
      return `${edge[0]}->${edge[1]}`;
    }

    function drawTree() {
      for (const edge of script.layout.edges) {
        const a = script.layout.nodes[edge[0]];
        const b = script.layout.nodes[edge[1]];
        const line = svgEl("line");
        line.setAttribute("class", "edge");
        line.setAttribute("x1", a.x);
        line.setAttribute("y1", a.y);
        line.setAttribute("x2", b.x);
        line.setAttribute("y2", b.y);
        svg.append(line);
        edgeEls.set(edgeKey(edge), line);
      }

      for (const edge of script.layout.extraEdges || []) {
        const a = script.layout.nodes[edge[0]];
        const b = script.layout.nodes[edge[1]];
        const line = svgEl("line");
        line.setAttribute("class", "edge new-edge");
        line.setAttribute("x1", a.x);
        line.setAttribute("y1", a.y);
        line.setAttribute("x2", b.x);
        line.setAttribute("y2", b.y);
        line.style.display = "none";
        svg.append(line);
        edgeEls.set(edgeKey(edge), line);
      }

      const nilLayer = svgEl("g");
      nilLayer.setAttribute("id", "nilLayer");
      svg.append(nilLayer);

      for (const [key, pos] of Object.entries(script.layout.nodes)) {
        const group = svgEl("g");
        const circle = svgEl("circle");
        const text = svgEl("text");
        group.setAttribute("class", "node");
        group.setAttribute("transform", `translate(${pos.x} ${pos.y})`);
        circle.setAttribute("r", pos.r || 30);
        text.textContent = pos.label || key;
        group.append(circle, text);
        svg.append(group);
        nodeEls.set(key, group);
      }

      const pointerLayer = svgEl("g");
      pointerLayer.setAttribute("id", "pointerLayer");
      svg.append(pointerLayer);
    }

    function drawCode() {
      code.innerHTML = "";
      script.code.forEach((line) => {
        const span = document.createElement("span");
        span.className = "line";
        span.textContent = line;
        code.append(span);
      });
    }

    function frameAt(ms) {
      return script.frames.reduce(
        (current, frame) => frame.at <= ms ? frame : current,
        script.frames[0]
      );
    }

    function framePairAt(ms) {
      let current = script.frames[0];
      let next = script.frames[script.frames.length - 1];

      for (let i = 0; i < script.frames.length; i++) {
        if (script.frames[i].at <= ms) {
          current = script.frames[i];
        }
        if (script.frames[i].at > ms) {
          next = script.frames[i];
          break;
        }
      }

      return {current, next};
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function positionInFrame(key, frame) {
      const base = script.layout.nodes[key];
      const override = frame.positions && frame.positions[key];
      return override ? {...base, ...override} : base;
    }

    function positionsAt(ms) {
      const {current, next} = framePairAt(ms);
      const span = Math.max(1, next.at - current.at);
      const t = next === current ? 0 : Math.max(0, Math.min(1, (ms - current.at) / span));
      const result = {};

      for (const key of Object.keys(script.layout.nodes)) {
        const a = positionInFrame(key, current);
        const b = positionInFrame(key, next);
        result[key] = {
          ...a,
          x: lerp(a.x, b.x, t),
          y: lerp(a.y, b.y, t)
        };
      }

      return result;
    }

    function drawPointer(name, nodeKey, color, offsetY) {
      if (!nodeKey || nodeKey === "NIL" || !script.layout.nodes[nodeKey]) {
        return;
      }
      const point = currentPositions[nodeKey] || script.layout.nodes[nodeKey];
      const text = svgEl("text");
      text.setAttribute("class", "pointer");
      text.setAttribute("fill", color);
      text.setAttribute("x", point.x);
      text.setAttribute("y", point.y + offsetY);
      text.textContent = name;
      document.getElementById("pointerLayer").append(text);
    }

    function drawNil(mark) {
      if (!mark) {
        return;
      }
      const group = svgEl("g");
      group.setAttribute("transform", `translate(${mark.x} ${mark.y})`);
      const rect = svgEl("rect");
      rect.setAttribute("class", "nil-box");
      rect.setAttribute("x", -28);
      rect.setAttribute("y", -16);
      rect.setAttribute("width", 56);
      rect.setAttribute("height", 32);
      const text = svgEl("text");
      text.setAttribute("class", "nil-text");
      text.textContent = mark.label || "NIL";
      group.append(rect, text);
      document.getElementById("nilLayer").append(group);
    }

    function update(ms) {
      const frame = frameAt(ms);
      currentPositions = positionsAt(ms);
      const seen = new Set(frame.seen || []);
      const visited = new Set(frame.visited || []);
      const focus = new Set(frame.focus || []);
      const warn = new Set(frame.warn || []);
      const hidden = new Set(frame.hidden || []);
      const colors = frame.colors || script.initialColors || {};

      for (const [key, group] of nodeEls) {
        const pos = currentPositions[key] || script.layout.nodes[key];
        group.setAttribute("transform", `translate(${pos.x} ${pos.y})`);
        group.style.display = hidden.has(key) ? "none" : "";
        group.classList.toggle("seen", seen.has(key));
        group.classList.toggle("visited", visited.has(key));
        group.classList.toggle("active", key === frame.activeNode);
        group.classList.toggle("focus", focus.has(key));
        group.classList.toggle("warn", warn.has(key));
        group.classList.toggle("black", colors[key] === "black");
        group.classList.toggle("red", colors[key] === "red");
        group.classList.toggle("ghost", (frame.ghost || []).includes(key));
      }

      const activeEdges = new Set((frame.activeEdges || []).map(edgeKey));
      const cutEdges = new Set((frame.cutEdges || []).map(edgeKey));
      const hiddenEdges = new Set((frame.hiddenEdges || []).map(edgeKey));
      const visibleExtra = new Set((frame.visibleExtraEdges || []).map(edgeKey));
      for (const [key, line] of edgeEls) {
        const isExtra = (script.layout.extraEdges || []).some((edge) => edgeKey(edge) === key);
        const edge = [...script.layout.edges, ...(script.layout.extraEdges || [])].find((item) => edgeKey(item) === key);
        if (edge) {
          const a = currentPositions[edge[0]] || script.layout.nodes[edge[0]];
          const b = currentPositions[edge[1]] || script.layout.nodes[edge[1]];
          line.setAttribute("x1", a.x);
          line.setAttribute("y1", a.y);
          line.setAttribute("x2", b.x);
          line.setAttribute("y2", b.y);
        }
        line.style.display = hiddenEdges.has(key) || (isExtra && !visibleExtra.has(key)) ? "none" : "";
        line.classList.toggle("active-edge", activeEdges.has(key));
        line.classList.toggle("cut", cutEdges.has(key));
      }

      document.getElementById("nilLayer").innerHTML = "";
      for (const mark of frame.nilMarks || []) {
        drawNil(mark);
      }

      const pointerLayer = document.getElementById("pointerLayer");
      pointerLayer.innerHTML = "";
      for (const pointer of frame.pointers || []) {
        drawPointer(pointer.name, pointer.node, pointer.color || "#2563eb", pointer.offsetY || -44);
      }

      [...code.querySelectorAll(".line")].forEach((line, index) => {
        line.classList.toggle("active", (frame.codeLines || []).includes(index));
      });

      label.textContent = frame.label;
      note.textContent = frame.note;
      state.textContent = frame.state || "";
      output.textContent = (frame.output || []).join(", ");
      stack.textContent = (frame.stack || []).join(" -> ");
      seek.value = String(Math.round(ms));
    }

    function tick(now) {
      const playbackRate = Number(speed.value);
      const ms = Math.min(script.durationMs, elapsedBeforePlay + (now - startTime) * playbackRate);
      update(ms);
      if (ms >= script.durationMs) {
        playing = false;
        play.textContent = "再生";
        elapsedBeforePlay = script.durationMs;
        return;
      }
      raf = requestAnimationFrame(tick);
    }

    function setPlaying(next) {
      playing = next;
      play.textContent = playing ? "一時停止" : "再生";
      if (playing) {
        if (elapsedBeforePlay >= script.durationMs) {
          elapsedBeforePlay = 0;
          update(0);
        }
        startTime = performance.now();
        raf = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(raf);
        elapsedBeforePlay = Number(seek.value);
      }
    }

    play.addEventListener("click", () => setPlaying(!playing));
    restart.addEventListener("click", () => {
      elapsedBeforePlay = 0;
      update(0);
      if (playing) startTime = performance.now();
    });
    seek.addEventListener("input", () => {
      elapsedBeforePlay = Number(seek.value);
      update(elapsedBeforePlay);
      if (playing) startTime = performance.now();
    });
    speed.addEventListener("change", () => {
      elapsedBeforePlay = Number(seek.value);
      if (playing) startTime = performance.now();
    });

    seek.max = String(script.durationMs);
    drawTree();
    drawCode();
    update(0);

  </script>
</body>
</html>
