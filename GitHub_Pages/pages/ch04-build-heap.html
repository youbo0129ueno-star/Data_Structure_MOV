  <title>ch04-build-heap</title>
  <style>

    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}

    .array rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:5}.array text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.array.active rect{fill:#ffedd5;stroke:var(--insert);stroke-width:3}.array.swap rect{fill:#dbeafe;stroke:var(--active);stroke-width:3}.marker{font-size:15px;font-weight:700;text-anchor:middle;fill:var(--active)}

    @media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}

<body>
  <main>
    <header><h1>ch04-build-heap</h1><div class="controls" aria-label="再生コントロール"><button id="play" type="button">再生</button><button id="restart" type="button">最初へ</button><label class="speed-label">速度<select id="speed" aria-label="再生速度"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select></label><input id="seek" type="range" min="0" max="35000" value="0" step="20" aria-label="再生位置"></div></header>

    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>

  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}function frameAt(ms){return script.frames[frameIndexAt(ms)]}
    function render(ms){const idx=frameIndexAt(ms),f=script.frames[idx],next=script.frames[idx+1],swap=f.swap??[],moving=swap.length===2&&next;const span=moving?Math.max(1,next.at-f.at):1;const t=moving?Math.min(1,Math.max(0,(ms-f.at)/span)):0;svg.innerHTML="";script.edges.forEach(([a,b])=>{if(a>=f.size||b>=f.size)return;const pa=script.positions[a],pb=script.positions[b],line=el("line");line.setAttribute("class",["edge",swap.includes(a)&&swap.includes(b)?"swap":""].join(" "));line.setAttribute("x1",pa[0]);line.setAttribute("y1",pa[1]);line.setAttribute("x2",pb[0]);line.setAttribute("y2",pb[1]);svg.append(line)});function movedTreePos(i){const p=script.positions[i];if(!moving||!swap.includes(i))return p;const other=swap[0]===i?swap[1]:swap[0],q=script.positions[other];return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t]}script.positions.forEach((p,i)=>{const q=movedTreePos(i),g=el("g");g.setAttribute("class",["node",i>=f.size?"empty":"done",f.active===i?"active":"",swap.includes(i)?"swap":""].join(" "));g.setAttribute("transform",`translate(${q[0]} ${q[1]})`);const c=el("circle");c.setAttribute("r",27);const txt=el("text");txt.textContent=f.values[i]??"";g.append(c,txt);svg.append(g);if(i<f.size){const ix=el("text");ix.setAttribute("x",p[0]);ix.setAttribute("y",p[1]+45);ix.setAttribute("class","marker");ix.textContent=i;svg.append(ix)}});const x0=82,y=382,w=54;function arrayX(i){let x=x0+i*w;if(!moving||!swap.includes(i))return x;const other=swap[0]===i?swap[1]:swap[0];return x+(x0+other*w-x)*t}f.values.forEach((v,i)=>{const g=el("g");g.setAttribute("class",["array",i===f.active?"active":"",swap.includes(i)?"swap":""].join(" "));g.setAttribute("transform",`translate(${arrayX(i)} ${y})`);const r=el("rect");r.setAttribute("width",w-4);r.setAttribute("height",30);const txt=el("text");txt.setAttribute("x",(w-4)/2);txt.setAttribute("y",15);txt.textContent=v??"";g.append(r,txt);svg.append(g)});label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)));seek.value=ms}
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener("click",()=>playing?pause():start());restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});drawCode();render(0);
  </script>
