<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch08-multiply</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--done:#16a34a;--swap:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px;line-height:1.25}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:720/360;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.cell rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:6}.cell text{font-size:14px;font-weight:700;text-anchor:middle}.cell.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.cell.bucketActive rect{fill:#ffedd5;stroke:var(--swap);stroke-width:4}.cell.filled rect,.cell.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:3}.edge{stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.edge.active{stroke:var(--active);stroke-width:5;marker-end:url(#arrow-active)}.bucket rect,.node rect{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:5}.bucket text,.node text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}.bucket.active rect,.node.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:4}.node.done rect{fill:#dcfce7;stroke:var(--done);stroke-width:4}.marker{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--active)}.formula{font-size:16px;font-weight:700;fill:var(--ink)}.calc{font-size:16px;fill:var(--ink)}.rowlabel{font-size:13px;font-weight:700;fill:var(--muted)}.nil{font-size:15px;font-weight:700;fill:var(--muted)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ch08-multiply</h1>
      <div class="controls" aria-label="再生コントロール">
        <button id="play" type="button">再生</button>
        <button id="restart" type="button">最初へ</button>
        <label class="speed-label">速度
          <select id="speed" aria-label="再生速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <input id="seek" type="range" min="0" max="15500" value="0" step="20" aria-label="再生位置">
      </div>
    </header>
    <section class="stage"><svg id="view" viewBox="0 0 720 360" role="img" aria-label="分割統治法による2進数の高速乗算(3回の半サイズ乗算への帰着)を再帰木で可視化するアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section>
    <aside class="side"><pre><code id="code"></code></pre></aside>
  </main>
  <script id="framescript" type="application/json">
{
  "durationMs": 15500,
  "code": [
    "int multiply(int x, int y, int n) {",
    "    if (n == 1) {",
    "        return x * y;",
    "    }",
    "    split x into p and q;",
    "    split y into r and s;",
    "    int u = multiply(p + q, r + s, n / 2);",
    "    int v = multiply(p, r, n / 2);",
    "    int w = multiply(q, s, n / 2);",
    "    return v * 2^n + (u - v - w) * 2^(n / 2) + w;",
    "}"
  ],
  "frames": [
    {
      "at": 0,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "",
        "value": null
      },
      "v": {
        "label": "",
        "value": null
      },
      "w": {
        "label": "",
        "value": null
      },
      "split": false,
      "edges": [],
      "final": false,
      "codeLines": [
        0,
        1
      ],
      "label": "呼び出し",
      "note": "本文に数値例がないため, n=2桁の2進数 x=3(11₂), y=2(10₂) という小さな独自の例で計算の流れを追う. n=2なので基底ケースではない."
    },
    {
      "at": 1700,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "",
        "value": null
      },
      "v": {
        "label": "",
        "value": null
      },
      "w": {
        "label": "",
        "value": null
      },
      "split": true,
      "edges": [],
      "final": false,
      "codeLines": [
        4,
        5
      ],
      "label": "分割",
      "note": "x=3=11₂ を上位1桁 p=1, 下位1桁 q=1 に分ける. y=2=10₂ を上位1桁 r=1, 下位1桁 s=0 に分ける."
    },
    {
      "at": 3400,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": null
      },
      "v": {
        "label": "",
        "value": null
      },
      "w": {
        "label": "",
        "value": null
      },
      "split": true,
      "edges": [
        "u"
      ],
      "final": false,
      "codeLines": [
        6
      ],
      "label": "u を計算",
      "note": "u = multiply(p+q, r+s, n/2) = multiply(1+1, 1+0, 1) = multiply(2,1,1) を呼び出す."
    },
    {
      "at": 5100,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": 2
      },
      "v": {
        "label": "",
        "value": null
      },
      "w": {
        "label": "",
        "value": null
      },
      "split": true,
      "edges": [
        "u"
      ],
      "final": false,
      "codeLines": [
        1,
        2
      ],
      "label": "u の基底ケース",
      "note": "n=1 なので基底ケース. u = x*y = 2*1 = 2 を返す."
    },
    {
      "at": 6800,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": 2
      },
      "v": {
        "label": "multiply(1,1,1)",
        "value": null
      },
      "w": {
        "label": "",
        "value": null
      },
      "split": true,
      "edges": [
        "u",
        "v"
      ],
      "final": false,
      "codeLines": [
        7
      ],
      "label": "v を計算",
      "note": "v = multiply(p, r, n/2) = multiply(1,1,1) を呼び出す."
    },
    {
      "at": 8500,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": 2
      },
      "v": {
        "label": "multiply(1,1,1)",
        "value": 1
      },
      "w": {
        "label": "",
        "value": null
      },
      "split": true,
      "edges": [
        "u",
        "v"
      ],
      "final": false,
      "codeLines": [
        1,
        2
      ],
      "label": "v の基底ケース",
      "note": "n=1 なので基底ケース. v = x*y = 1*1 = 1 を返す."
    },
    {
      "at": 10200,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": 2
      },
      "v": {
        "label": "multiply(1,1,1)",
        "value": 1
      },
      "w": {
        "label": "multiply(1,0,1)",
        "value": null
      },
      "split": true,
      "edges": [
        "u",
        "v",
        "w"
      ],
      "final": false,
      "codeLines": [
        8
      ],
      "label": "w を計算",
      "note": "w = multiply(q, s, n/2) = multiply(1,0,1) を呼び出す."
    },
    {
      "at": 11900,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": null
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": 2
      },
      "v": {
        "label": "multiply(1,1,1)",
        "value": 1
      },
      "w": {
        "label": "multiply(1,0,1)",
        "value": 0
      },
      "split": true,
      "edges": [
        "u",
        "v",
        "w"
      ],
      "final": false,
      "codeLines": [
        1,
        2
      ],
      "label": "w の基底ケース",
      "note": "n=1 なので基底ケース. w = x*y = 1*0 = 0 を返す."
    },
    {
      "at": 13600,
      "root": {
        "label": "multiply(x=3,y=2,n=2)",
        "value": 6
      },
      "u": {
        "label": "multiply(2,1,1)",
        "value": 2
      },
      "v": {
        "label": "multiply(1,1,1)",
        "value": 1
      },
      "w": {
        "label": "multiply(1,0,1)",
        "value": 0
      },
      "split": true,
      "edges": [
        "u",
        "v",
        "w"
      ],
      "final": true,
      "codeLines": [
        9
      ],
      "label": "統合",
      "note": "v*2^n + (u-v-w)*2^(n/2) + w = 1*4 + (2-1-0)*2 + 0 = 4+2+0 = 6. 実際 x*y = 3*2 = 6 と一致する."
    }
  ]
}
  </script>
  <script>
    const script=JSON.parse(document.getElementById("framescript").textContent),svg=document.getElementById("view"),code=document.getElementById("code"),label=document.getElementById("label"),note=document.getElementById("note"),play=document.getElementById("play"),restart=document.getElementById("restart"),seek=document.getElementById("seek"),speed=document.getElementById("speed");
    let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;
    function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}
    function write(x,y,s,cls){const t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class",cls);t.textContent=s;svg.append(t)}
    function marker(id,color){const m=el("marker"),p=el("path");m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");m.setAttribute("refX","9");m.setAttribute("refY","5");m.setAttribute("markerWidth","7");m.setAttribute("markerHeight","7");m.setAttribute("orient","auto");p.setAttribute("d","M 0 0 L 10 5 L 0 10 z");p.setAttribute("fill",color);m.append(p);return m}
    function arrowDefs(){const defs=el("defs");defs.append(marker("arrow","#94a3b8"),marker("arrow-active","#2563eb"));svg.append(defs)}
    function drawCode(){script.code.forEach((line)=>{const s=document.createElement("span");s.className="line";s.textContent=line;code.append(s)})}
    function frameIndexAt(ms){let idx=0;script.frames.forEach((f,i)=>{if(f.at<=ms)idx=i});return idx}
    function highlightCode(f){[...code.children].forEach((line,i)=>line.classList.toggle("active",f.codeLines.includes(i)))}
    // ---- BEGIN custom render (per-algorithm; must define function render(ms){...}) ----
const ROOT_X = 360, ROOT_Y = 40, ROOT_W = 300, ROOT_H = 64;
const CHILD_Y = 200, CHILD_W = 200, CHILD_H = 64;
const CHILD_X = { u: 140, v: 360, w: 580 };

function box(cx, y, w, h, fill, stroke, sw) {
  const r = el("rect");
  r.setAttribute("x", cx - w / 2); r.setAttribute("y", y);
  r.setAttribute("width", w); r.setAttribute("height", h);
  r.setAttribute("rx", 8);
  r.setAttribute("fill", fill); r.setAttribute("stroke", stroke);
  r.setAttribute("stroke-width", sw);
  svg.append(r);
}

function edgeLine(x1, y1, x2, y2, active) {
  const ln = el("line");
  ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
  ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
  ln.setAttribute("class", "edge" + (active ? " active" : ""));
  svg.append(ln);
}

function node(cx, y, w, h, label1, value) {
  const done = value !== null && value !== undefined;
  box(cx, y, w, h, done ? "#dcfce7" : "#fff", done ? "#16a34a" : "#94a3b8", done ? 3 : 2);
  write(cx, y + 26, label1, "calc");
  write(cx, y + 50, done ? ("= " + value) : "", "formula");
}

function render(ms) {
  const idx = frameIndexAt(ms), f = script.frames[idx];
  svg.innerHTML = "";
  arrowDefs();

  node(ROOT_X, ROOT_Y, ROOT_W, ROOT_H, f.root.label, f.root.value);

  ["u", "v", "w"].forEach((key) => {
    if (f.edges.includes(key)) {
      const cx = CHILD_X[key];
      edgeLine(ROOT_X, ROOT_Y + ROOT_H, cx, CHILD_Y, f[key].value === null || f[key].value === undefined);
      node(cx, CHILD_Y, CHILD_W, CHILD_H, f[key].label, f[key].value);
    }
  });

  if (f.final) {
    write(ROOT_X, CHILD_Y + CHILD_H + 40, "x*y = 3*2 = 6 と一致", "formula");
  }

  label.textContent = f.label;
  note.textContent = f.note;
  highlightCode(f);
  seek.value = ms;
}
    // ---- END custom render ----
    function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent="再生";return}raf=requestAnimationFrame(tick)}
    function start(){if(playing)return;playing=true;play.textContent="一時停止";startTime=performance.now();raf=requestAnimationFrame(tick)}
    function pause(){playing=false;play.textContent="再生";cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}
    play.addEventListener("click",()=>playing?pause():start());
    restart.addEventListener("click",()=>{pause();elapsedBeforePlay=0;render(0)});
    seek.addEventListener("input",()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});
    speed.addEventListener("change",()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});
    drawCode();render(0);
  </script>
</body>
