<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ch04-insertion-sort</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--panel:#f8fafc;--line:#cbd5e1;--active:#2563eb;--sorted:#16a34a;--shift:#f97316;--code:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);background:#fff}main{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr);gap:24px;width:min(1120px,calc(100vw - 32px));margin:24px auto;align-items:start}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{margin:0;font-size:24px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--active);color:var(--active)}.speed-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}input[type=range]{width:220px}.stage,.side{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stage{padding:18px}svg{display:block;width:100%;aspect-ratio:720/360;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.bar rect{fill:#fff;stroke:#94a3b8;stroke-width:3;rx:7}.bar text{font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}.bar.sorted rect{fill:#dcfce7;stroke:var(--sorted)}.bar.active rect{fill:#dbeafe;stroke:var(--active);stroke-width:5}.bar.shift rect{fill:#ffedd5;stroke:var(--shift);stroke-width:5}.marker{font-size:16px;font-weight:700;text-anchor:middle;fill:var(--active)}.message{margin-top:14px;min-height:112px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:6px}.label{margin:0 0 8px;font-size:18px;font-weight:700}.note{margin:0;color:var(--muted);line-height:1.65}.side{padding:16px}pre{margin:0;overflow-x:auto;font-size:14px;line-height:1.6;counter-reset:line}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:22px;padding:0 8px;border-left:3px solid transparent;white-space:pre}.line::before{counter-increment:line;content:counter(line);display:inline-block;width:2ch;margin-right:16px;color:#94a3b8;text-align:right}.line.active{background:var(--code);border-left-color:var(--active)}@media(max-width:820px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
  </style>
</head>
<body><main><header><h1>ch04-insertion-sort</h1><div class="controls" aria-label="再生コントロール"><button id="play" type="button">再生</button><button id="restart" type="button">最初へ</button><label class="speed-label">速度<select id="speed" aria-label="再生速度"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select></label><input id="seek" type="range" min="0" value="0" step="20" aria-label="再生位置"></div></header><section class="stage"><svg id="view" viewBox="0 0 720 360" role="img" aria-label="挿入ソートのアニメーション"></svg><div class="message"><p id="label" class="label"></p><p id="note" class="note"></p></div></section><aside class="side"><pre><code id="code"></code></pre></aside></main>
  <script>
    const script={code:['void insertion_sort(int A[], int n) {','    for (int i = 1; i <= n - 1; i++) {','        int a = A[i];','        int j = i - 1;','        while (j >= 0 && A[j] > a) {','            A[j + 1] = A[j];','            j = j - 1;','        }','        A[j + 1] = a;','    }','}'],frames:[]};const A=[5,2,4,6,1],n=A.length;let at=0;function add(values,sorted,active,shift,i,j,a,codeLines,label,note){script.frames.push({at,values:[...values],sorted,active,shift,i,j,a,codeLines,label,note});at+=1500}add(A,[0],[0],[],0,-1,'-',[0],'開始','A[0] だけを長さ 1 の整列済み区間とみなす. 次の外側ループで i = 1 になる.');for(let i=1;i<n;i++){const a=A[i];let j=i-1;add(A,Array.from({length:i},(_,k)=>k),[i],[],i,j,a,[1],`i = ${i} になる`,`for 文により i は 1 ずつ増える. A[0] から A[${i-1}] が整列済みであり, A[${i}] をそこへ挿入する.`);add(A,Array.from({length:i},(_,k)=>k),[i,j],[],i,j,a,[2,3],`a = A[${i}] = ${a}, j = ${j}`,'a を一時変数へ退避する. 以後 A[j] を右へコピーしても a は失われない.');while(j>=0){add(A,Array.from({length:i},(_,k)=>k),[j,i],[],i,j,a,[4],`A[${j}] = ${A[j]} と a = ${a} を比較する`,A[j]>a?'条件は真なので A[j] を右へコピーする.':'条件は偽なので右シフトを止める.');if(A[j]<=a)break;const moved=A[j];A[j+1]=moved;add(A,Array.from({length:j+1},(_,k)=>k),[j+1],[j,j+1],i,j,a,[5],`${moved} を A[${j+1}] へ右シフトする`,'交換ではなくコピーである. 空き位置は 1 つ左へ移る.');j--;add(A,Array.from({length:j+1},(_,k)=>k),[j+1],[],i,j,a,[6],`j = ${j} とする`,'さらに左側の要素と a を比較する.')}A[j+1]=a;add(A,Array.from({length:i+1},(_,k)=>k),[j+1],[],i,j,a,[8],`A[${j+1}] = a = ${a}`,'挿入完了. 整列済み区間が A[0] から A['+i+'] まで広がる.')}add(A,[0,1,2,3,4],[],[],'-','-','-',[10],'整列完了','配列全体が昇順になった.');script.durationMs=at-1500;
    const svg=document.getElementById('view'),code=document.getElementById('code'),label=document.getElementById('label'),note=document.getElementById('note'),play=document.getElementById('play'),restart=document.getElementById('restart'),seek=document.getElementById('seek'),speed=document.getElementById('speed');let startTime=0,elapsedBeforePlay=0,raf=0,playing=false;function el(n){return document.createElementNS('http://www.w3.org/2000/svg',n)}function drawCode(){script.code.forEach(line=>{const s=document.createElement('span');s.className='line';s.textContent=line;code.append(s)})}function frameAt(ms){return script.frames.reduce((c,f)=>f.at<=ms?f:c,script.frames[0])}function render(ms){const f=frameAt(ms);svg.innerHTML='';const x0=130,w=78,gap=16,y=135,h=72;f.values.forEach((v,i)=>{const g=el('g');g.setAttribute('class',['bar',f.sorted.includes(i)?'sorted':'',f.active.includes(i)?'active':'',f.shift.includes(i)?'shift':''].join(' '));g.setAttribute('transform',`translate(${x0+i*(w+gap)} ${y})`);const r=el('rect');r.setAttribute('width',w);r.setAttribute('height',h);const t=el('text');t.setAttribute('x',w/2);t.setAttribute('y',h/2);t.textContent=v;g.append(r,t);svg.append(g);const ix=el('text');ix.setAttribute('x',x0+i*(w+gap)+w/2);ix.setAttribute('y',y+h+30);ix.setAttribute('class','marker');ix.textContent=i;svg.append(ix)});[['i',f.i,70],['j',f.j,94]].forEach(([name,index,yy])=>{if(Number.isInteger(index)&&index>=0){const t=el('text');t.setAttribute('x',x0+index*(w+gap)+w/2);t.setAttribute('y',yy);t.setAttribute('class','marker');t.textContent=`${name}=${index}`;svg.append(t)}});const a=el('text');a.setAttribute('x',360);a.setAttribute('y',45);a.setAttribute('class','marker');a.textContent=`a = ${f.a}`;svg.append(a);label.textContent=f.label;note.textContent=f.note;[...code.children].forEach((line,i)=>line.classList.toggle('active',f.codeLines.includes(i)));seek.value=ms}function tick(now){const ms=Math.min((now-startTime)*Number(speed.value)+elapsedBeforePlay,script.durationMs);render(ms);if(ms>=script.durationMs){playing=false;play.textContent='再生';return}raf=requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;play.textContent='一時停止';startTime=performance.now();raf=requestAnimationFrame(tick)}function pause(){playing=false;play.textContent='再生';cancelAnimationFrame(raf);elapsedBeforePlay=Number(seek.value)}play.addEventListener('click',()=>playing?pause():start());restart.addEventListener('click',()=>{pause();elapsedBeforePlay=0;render(0)});seek.addEventListener('input',()=>{elapsedBeforePlay=Number(seek.value);render(elapsedBeforePlay);if(playing)startTime=performance.now()});speed.addEventListener('change',()=>{if(playing){elapsedBeforePlay=Number(seek.value);startTime=performance.now()}});seek.max=script.durationMs;drawCode();render(0);
  </script></body></html>
