<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>挿入ソート: i, j, a を追う</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#cbd5e1; --panel:#f8fafc; --blue:#2563eb; --green:#16a34a; --orange:#ea580c; --red:#dc2626; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; }
    main { width:min(1160px,calc(100vw - 32px)); margin:24px auto; display:grid; grid-template-columns:minmax(480px,1.2fr) minmax(320px,.8fr); gap:22px; }
    header { grid-column:1/-1; border-bottom:1px solid var(--line); padding-bottom:14px; }
    h1 { margin:0 0 6px; font-size:24px; }
    header p { margin:0; color:var(--muted); }
    .stage,.code-panel { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:18px; }
    .stage { min-height:560px; }
    .state { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .chip { padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:#fff; font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .chip strong { color:var(--blue); }
    .array-title { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:14px 0 8px; }
    .array-title h2 { margin:0; font-size:18px; }
    .array-title span { color:var(--muted); font-size:14px; }
    .array { display:flex; gap:10px; align-items:flex-start; min-height:132px; padding:14px 6px 8px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; }
    .cell-wrap { width:76px; text-align:center; position:relative; }
    .mark { height:23px; color:var(--blue); font:700 14px ui-monospace,SFMono-Regular,monospace; }
    .cell { height:58px; display:grid; place-items:center; border:3px solid #94a3b8; border-radius:8px; background:#fff; font:700 22px ui-monospace,SFMono-Regular,monospace; transition:.18s; }
    .cell.sorted { border-color:var(--green); background:#dcfce7; }
    .cell.i { border-color:var(--blue); background:#dbeafe; box-shadow:0 0 0 3px #bfdbfe; }
    .cell.j { border-color:var(--orange); background:#ffedd5; }
    .cell.shift { border-color:var(--red); background:#fee2e2; }
    .index { margin-top:6px; color:var(--muted); font:13px ui-monospace,SFMono-Regular,monospace; }
    .range { margin:14px 0; padding:10px 12px; border-left:4px solid var(--green); background:#ecfdf5; line-height:1.55; }
    .message { min-height:106px; padding:14px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; }
    .message h2 { margin:0 0 8px; font-size:18px; }
    .message p { margin:0; color:var(--muted); line-height:1.65; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
    button { padding:9px 14px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font:inherit; cursor:pointer; }
    button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #counter { margin-left:auto; color:var(--muted); font-size:14px; }
    pre { margin:0; overflow:auto; counter-reset:line; font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    .line { display:block; padding:0 8px; border-left:3px solid transparent; white-space:pre; }
    .line::before { counter-increment:line; content:counter(line); display:inline-block; width:2ch; margin-right:15px; color:#94a3b8; text-align:right; }
    .line.active { border-left-color:var(--blue); background:#dbeafe; }
    .legend { margin:16px 0 0; padding:0; list-style:none; color:var(--muted); font-size:14px; line-height:1.8; }
    .legend b { display:inline-block; width:12px; height:12px; margin-right:6px; border:2px solid; border-radius:3px; vertical-align:-1px; }
    @media (max-width:820px) { main { grid-template-columns:1fr; } .array { gap:5px; overflow-x:auto; } .cell-wrap { min-width:66px; width:66px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>挿入ソート: 外側ループから追う</h1>
      <p>「次へ」を押し, <code>i</code> が 1 から増える過程と, その回の <code>a</code>, <code>j</code> の役割を順に確認する.</p>
    </header>
    <section class="stage" aria-live="polite">
      <div id="state" class="state"></div>
      <div class="array-title"><h2>配列 <code>A</code></h2><span>緑: その回の開始時点で整列済みの区間</span></div>
      <div id="array" class="array" aria-label="配列の状態"></div>
      <div id="range" class="range"></div>
      <div class="message"><h2 id="label"></h2><p id="note"></p></div>
      <div class="controls">
        <button id="prev" type="button">← 前へ</button>
        <button id="next" type="button">次へ →</button>
        <button id="restart" type="button">最初へ</button>
        <span id="counter"></span>
      </div>
    </section>
    <aside class="code-panel">
      <pre><code id="code"></code></pre>
      <ul class="legend">
        <li><b style="border-color:#16a34a;background:#dcfce7"></b>整列済み区間</li>
        <li><b style="border-color:#2563eb;background:#dbeafe"></b><code>i</code>: 今回挿入する要素の添字</li>
        <li><b style="border-color:#ea580c;background:#ffedd5"></b><code>j</code>: 比較中の左側の添字</li>
        <li><b style="border-color:#dc2626;background:#fee2e2"></b>右へコピーする要素</li>
      </ul>
    </aside>
  </main>
  <script>
    const codeLines = [
      'void insertion_sort(int A[], int n) {',
      '    for (int i = 1; i <= n - 1; i++) {',
      '        int a = A[i];',
      '        int j = i - 1;',
      '        while (j >= 0 && A[j] > a) {',
      '            A[j + 1] = A[j];',
      '            j = j - 1;',
      '        }',
      '        A[j + 1] = a;',
      '    }',
      '}'
    ];
    const initial = [5, 2, 4, 6, 1];
    const steps = [];
    const copy = a => [...a];
    function add({values, i=null, j=null, a=null, sortedEnd=-1, shift=[], lines=[], label, note}) {
      steps.push({values:copy(values), i, j, a, sortedEnd, shift, lines, label, note});
    }
    function makeSteps() {
      const A = copy(initial);
      add({values:A, lines:[0], label:'開始: まだ整列済み区間は A[0] だけである', note:'挿入ソートは A[0] を長さ 1 の整列済み区間とみなし, その右の要素を 1 つずつこの区間へ入れる.'});
      for (let i = 1; i < A.length; i++) {
        const sortedEnd = i - 1;
        add({values:A, i, sortedEnd, lines:[1], label:`外側ループ: i = ${i} になる`, note:`for 文が i を 1 ずつ増やす. A[0] から A[${sortedEnd}] までは前回までに整列済みであり, 今回は A[${i}] をそこへ挿入する.`});
        const a = A[i];
        let j = i - 1;
        add({values:A, i, j, a, sortedEnd, lines:[2,3], label:`a = A[${i}] = ${a} を退避し, j = ${j} とする`, note:'a は挿入したい値を一時的に保存する変数である. これから A[j] を右へコピーしても, a 自身は失われない.'});
        while (j >= 0) {
          add({values:A, i, j, a, sortedEnd, lines:[4], label:`A[${j}] = ${A[j]} と a = ${a} を比較する`, note:`条件 A[j] > a は ${A[j] > a ? '真' : '偽'}である.${A[j] > a ? ' A[j] を右へずらす.' : ' 右シフトを止め, j + 1 に a を入れる.'}`});
          if (A[j] <= a) break;
          const moved = A[j];
          A[j + 1] = moved;
          add({values:A, i, j, a, sortedEnd, shift:[j, j + 1], lines:[5], label:`A[${j + 1}] = A[${j}] = ${moved}: ${moved} を右へコピーする`, note:'交換ではなくコピーである. a は別の変数に退避済みなので, 空き位置は 1 つ左へ移動する.'});
          j--;
          add({values:A, i, j, a, sortedEnd, lines:[6], label:`j = ${j} に更新する`, note:'次はさらに左の要素と a を比較する. j が -1 なら, a は先頭 A[0] に入る.'});
        }
        A[j + 1] = a;
        add({values:A, i, j, a, sortedEnd:i, lines:[8], label:`A[${j + 1}] = a = ${a}: 挿入完了`, note:`A[0] から A[${i}] までが昇順に整列済みになった. 次の外側ループでは i が ${i + 1} になる.`});
      }
      add({values:A, sortedEnd:A.length - 1, lines:[10], label:'完了: 配列全体が整列済みである', note:'外側ループが i = n - 1 まで終わったため, A[0] から A[n - 1] の全体が昇順に並ぶ.'});
    }
    const array = document.getElementById('array');
    const state = document.getElementById('state');
    const range = document.getElementById('range');
    const label = document.getElementById('label');
    const note = document.getElementById('note');
    const code = document.getElementById('code');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let position = 0;
    function drawCode() { codeLines.forEach(line => { const s = document.createElement('span'); s.className = 'line'; s.textContent = line; code.append(s); }); }
    function chip(name, value) { return `<span class="chip"><strong>${name}</strong> = ${value}</span>`; }
    function render() {
      const s = steps[position];
      state.innerHTML = [chip('i', s.i === null ? '開始前' : s.i), chip('j', s.j === null ? '未設定' : s.j), chip('a', s.a === null ? '未退避' : s.a)].join('');
      array.innerHTML = '';
      s.values.forEach((value, index) => {
        const wrap = document.createElement('div'); wrap.className = 'cell-wrap';
        const mark = document.createElement('div'); mark.className = 'mark';
        mark.textContent = `${index === s.i ? 'i' : ''}${index === s.j ? (index === s.i ? ', j' : 'j') : ''}`;
        const cell = document.createElement('div');
        cell.className = `cell${index <= s.sortedEnd ? ' sorted' : ''}${index === s.i ? ' i' : ''}${index === s.j ? ' j' : ''}${s.shift.includes(index) ? ' shift' : ''}`;
        cell.textContent = value;
        const idx = document.createElement('div'); idx.className = 'index'; idx.textContent = `A[${index}]`;
        wrap.append(mark, cell, idx); array.append(wrap);
      });
      range.innerHTML = s.sortedEnd >= 0 ? `<b>整列済み区間:</b> A[0] から A[${s.sortedEnd}]` : '<b>整列済み区間:</b> これから A[0] を基準に作る';
      label.textContent = s.label; note.textContent = s.note;
      [...code.children].forEach((line, i) => line.classList.toggle('active', s.lines.includes(i)));
      prev.disabled = position === 0; next.disabled = position === steps.length - 1;
      counter.textContent = `${position + 1} / ${steps.length}`;
    }
    makeSteps(); drawCode(); render();
    prev.addEventListener('click', () => { position--; render(); });
    next.addEventListener('click', () => { position++; render(); });
    document.getElementById('restart').addEventListener('click', () => { position = 0; render(); });
  </script>
</body>
</html>
